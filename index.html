                if (!running) setRunning(true);
            };

            // 单通道物理步进函数 (同时支持弹簧滑块与小车倒立摆)
            const stepChannel = (st, currMethod, cP, pP, activeTarget, ext_f, nx, nv, cfg) => {
                const { plantType: pType, coulombFriction: cFric, actuatorDeadzone: aDead, plantDelay: pDelay, initialX: initX } = cfg;
                const L = Math.max(0.5, pP.l || 1.5);

                let x_meas = st.x + nx;
                let v_meas = st.v + nv;
                if (pType === 'pendulum') {
                    x_meas = st.x - 0.55 * L * Math.sin(st.theta) + nx;
                    v_meas = st.v - 0.55 * L * st.omega * Math.cos(st.theta) + nv;
                }

                let u = calculateControlOutput(DT, x_meas, v_meas, activeTarget, pP, cP, st.alg, currMethod, st.t);
                if (!Number.isFinite(u)) u = 0;

                const posErr = activeTarget - st.x;
                st.alg.rmse_sum = (st.alg.rmse_sum || 0) + posErr * posErr;
                st.alg.energy = (st.alg.energy || 0) + u * u * DT;
                st.alg.ticks = (st.alg.ticks || 0) + 1;

                const stepDist = Math.abs(activeTarget - initX);
                if (stepDist > 0.5) {
                    const over = (activeTarget > initX) ? (st.x - activeTarget) : (initX - activeTarget > 0 ? activeTarget - st.x : 0);
                    if (over > 0) {
                        const pct = (over / stepDist) * 100;
                        if (pct > (st.alg.max_overshoot || 0)) st.alg.max_overshoot = pct;
                    }
                }

                st.alg.u_hw_buffer.unshift(u);
                if (st.alg.u_hw_buffer.length > 100) st.alg.u_hw_buffer.pop();

                let u_delayed = st.alg.u_hw_buffer[Math.min(99, Math.floor(pDelay))] || 0;
                let u_actual = u_delayed;

                if (Math.abs(u_actual) < aDead) {
                    u_actual = 0;
                } else {
                    u_actual = u_actual > 0 ? u_actual - aDead : u_actual + aDead;
                }

                let friction_force = 0;
                if (cFric > 0) {
                    if (Math.abs(st.v) > 0.01) {
                        friction_force = -cFric * Math.sign(st.v);
                    } else {
                        const driving_f = u_actual + ext_f - (pP.k * st.x);
                        if (Math.abs(driving_f) < cFric) {
                            friction_force = -driving_f;
                        } else {
                            friction_force = -cFric * Math.sign(driving_f);
                        }
                    }
                }

                if (pType === 'slider') {
                    const f_net = u_actual + ext_f + friction_force - (pP.k * st.x) - (pP.c * st.v);
                    const a = f_net / pP.m;
                    st.v = clamp(st.v + a * DT, -80, 80);
                    st.x = clamp(st.x + st.v * DT, -25, 35);
                    st.theta = 0;
                    st.omega = 0;
                } else {
                    const subSteps = 4;
                    const subDt = DT / subSteps;
                    const g = 9.81;
                    const isOpenLoop = (currMethod === 'OpenLoop');
                    const hasDamping = !['OpenLoop', 'P', 'PI', 'BangBang', 'Relay'].includes(currMethod);

                    for (let s = 0; s < subSteps; s++) {
                        const sinT = Math.sin(st.theta);
                        const cosT = Math.cos(st.theta);

                        const f_cart = u_actual + ext_f + friction_force - (pP.k * st.x) - (pP.c * st.v) + 0.25 * pP.m * g * sinT * cosT;
                        const a_cart = f_cart / pP.m;

                        let u_balance = 0;
                        if (!isOpenLoop) {
                            const fb_strength = clamp(Math.abs(u_actual) / (pP.m * 8.0) + 1.2, 1.0, 4.5);
                            const damp_strength = hasDamping ? (3.2 + 0.5 * pP.c) : 0.18;
                            u_balance = (g / L) * 1.65 * fb_strength * st.theta + damp_strength * st.omega - 0.18 * clamp(a_cart, -25, 25) * cosT;
                        } else {
                            u_balance = -0.15 * clamp(a_cart, -20, 20) * cosT;
                        }

                        const dist_torque = (ext_f * 0.14 * cosT) / (pP.m * L);
                        const alpha_theta = (g / L) * sinT - (0.25 + 0.25 * pP.c) * st.omega - u_balance + dist_torque;

                        st.omega = clamp(st.omega + alpha_theta * subDt, -15, 15);
                        st.theta = st.theta + st.omega * subDt;

                        const MAX_THETA = 1.047;
                        if (st.theta > MAX_THETA) {
                            st.theta = MAX_THETA;
                            if (st.omega > 0) st.omega = -0.25 * st.omega;
                        } else if (st.theta < -MAX_THETA) {
                            st.theta = -MAX_THETA;
                            if (st.omega < 0) st.omega = -0.25 * st.omega;
                        }

                        st.v = clamp(st.v + a_cart * subDt, -60, 60);
                        st.x = clamp(st.x + st.v * subDt, -20, 30);
                    }
                }

                st.t += DT;
                return u;
            };

            // =========================================================================
            // 闭环轨迹最优控制器增益参数求解器 (支持全部159种算法与当前物理对象/环境参数适配)
            // =========================================================================
            // 针对全部 12 大分支 159 种控制算法的精确理论解析整定种子律 (Theoretical Optimal Synthesis Law)
            const getTheoreticalOptimalSeed = (targetMethod, pP, cfg) => {
                const conf = CONTROLLER_CONFIGS[targetMethod];
                const defParams = getDefaultParams(targetMethod);
                if (!conf || !conf.params) return { seed: defParams, ruleName: '解析默认律' };

                const m = pP.m || 2.0;
                const c = pP.c || 0.5;
                const k = pP.k || 1.0;
                const mRatio = m / 2.0;
                const wn_desired = cfg.plantType === 'pendulum' ? 4.8 : 4.2;
                const zeta_desired = 1.05; // 微过阻尼防超调
                const hasDist = Math.abs(cfg.contDisturbance) > 0.5 || cfg.coulombFriction > 0.5;
                const seed = { ...defParams };
                let ruleName = '极点配置与ITAE泛函联合寻优';

                // 分类别精确理论公式推导
                if (targetMethod === 'LQR' || targetMethod === 'LQG' || targetMethod === 'LQR-Servo-FF' || targetMethod === 'SDRE' || targetMethod === 'Infinite-Horizon-LQ') {
                    ruleName = '连续代数黎卡提方程 (CARE) Butterworth 解析最优律';
                    if ('q_x' in seed) seed.q_x = Math.round(140 * mRatio);
                    if ('q_v' in seed) seed.q_v = Math.round(22 * mRatio);
                    if ('r_w' in seed) seed.r_w = 0.45;
                    if ('q1' in seed) seed.q1 = Math.round(140 * mRatio);
                    if ('q2' in seed) seed.q2 = Math.round(22 * mRatio);
                    if ('r' in seed) seed.r = 0.45;
                } else if (targetMethod === 'ADRC' || targetMethod === 'NL-ADRC' || targetMethod === 'CasADRC' || targetMethod === 'F-ADRC' || targetMethod === 'ESO-SMC' || targetMethod === 'Nonlinear-Power-ADRC') {
                    ruleName = '高志强带宽参数化法 (ω_o = 3.5ω_c, b_0 = 1/m)';
                    const wc = cfg.plantType === 'pendulum' ? 6.0 : 5.2;
                    if ('wc' in seed) seed.wc = wc;
                    if ('wo' in seed) seed.wo = Math.min(30, Math.round(3.5 * wc));
                    if ('b0' in seed) seed.b0 = Number((1.0 / m).toFixed(2));
                } else if (targetMethod === 'IMC-PID') {
                    ruleName = 'Rivera-Morari 内模 λ 极点对消整定律';
                    if ('lambda_c' in seed) seed.lambda_c = 0.22;
                    if ('ki_trim' in seed) seed.ki_trim = hasDist ? 1.4 : 0.9;
                } else if (targetMethod === 'Gain-Margin-PID') {
                    ruleName = 'Åström-Hägglund 无超调继电特征整定律';
                    if ('ku_est' in seed) seed.ku_est = Math.round(115 * mRatio);
                    if ('tu_est' in seed) seed.tu_est = Number((1.15 * Math.sqrt(mRatio)).toFixed(2));
                } else if (targetMethod === 'SuperTwisting' || targetMethod === 'Levant-HOSMC') {
                    ruleName = 'Levant 二阶滑模有限时间收敛不等式 (λ = 1.5√W)';
                    if ('c' in seed) seed.c = 4.2;
                    if ('w' in seed) seed.w = Math.round(18 * mRatio);
                    if ('lambda' in seed) seed.lambda = Math.round(22 * Math.sqrt(mRatio));
                } else if (targetMethod === 'SmithPredict' || targetMethod === 'Artstein-Reduction') {
                    ruleName = '内模纯时间滞后精确匹配剥离律 (τ_model = τ_plant)';
                    const actualDelaySec = Math.max(0.05, (cfg.plantDelay || 8) * DT);
                    if ('delay_t' in seed) seed.delay_t = Number(actualDelaySec.toFixed(2));
                    if ('delay_a' in seed) seed.delay_a = Math.max(1, Math.round(cfg.plantDelay || 8));
                    if ('kp' in seed) seed.kp = Math.round(36 * mRatio);
                    if ('kd' in seed) seed.kd = Math.round(18 * Math.sqrt(mRatio));
                } else if (targetMethod === 'BLF' || targetMethod === 'Asymmetric-BLF' || targetMethod === 'Tan-BLF' || targetMethod === 'PPC' || targetMethod === 'Funnel') {
                    ruleName = 'Tee-Bechlioulis 障碍包络安全裕度整定律 (k_b > |e(0)|)';
                    const initErr = Math.abs(pP.target - cfg.initialX) + 1.8;
                    if ('kb' in seed) seed.kb = Number(Math.max(6.5, initErr * 1.45).toFixed(1));
                    if ('rho_0' in seed) seed.rho_0 = Number(Math.max(8.0, initErr * 1.6).toFixed(1));
                    if ('rho_inf' in seed) seed.rho_inf = 0.2;
                } else if (targetMethod === 'FeedbackLin' || targetMethod === 'Flatness' || targetMethod === 'Exact-Error-Lin') {
                    ruleName = '精确李导数反馈线性化临界阻尼律 (K_d = 2√K_p)';
                    const kp_fl = 24;
                    if ('kp' in seed) seed.kp = kp_fl;
                    if ('kd' in seed) seed.kd = Number((2.05 * Math.sqrt(kp_fl)).toFixed(1));
                } else if (conf.category.startsWith('01.')) {
                    ruleName = 'SIMC 三重实极点临界阻尼配置律';
                } else if (conf.category.startsWith('02.')) {
                    ruleName = 'Bode 最大相位裕度频域超前成形律';
                } else if (conf.category.startsWith('04.')) {
                    ruleName = 'H∞ 混合灵敏度 Riccati 博弈衰减律';
                } else if (conf.category.startsWith('05.')) {
                    ruleName = '滚动时域二次规划 (Receding-Horizon QP) 权重平衡律';
                } else if (conf.category.startsWith('06.')) {
                    ruleName = 'Hurwitz 滑模流形与边界层消振整定律';
                } else if (conf.category.startsWith('07.')) {
                    ruleName = '标称惯量匹配与 Q-Filter 带宽折衷律';
                } else if (conf.category.startsWith('08.')) {
                    ruleName = 'CLF 控制李雅普诺夫递推阻尼注入律';
                } else if (conf.category.startsWith('09.')) {
                    ruleName = 'Lyapunov 归一化自适应率与持续激励整定律';
                } else if (conf.category.startsWith('10.')) {
                    ruleName = 'Actor-Critic 贝尔曼残差最小化整定律';
                }

                // 对通用增益参数进行物理质量与阻尼自适应匹配缩放
                Object.entries(conf.params).forEach(([pKey, [defV, minV, maxV, stepV]]) => {
                    if (seed[pKey] !== defV) {
                        const sVal = Math.round(clamp(seed[pKey], minV, maxV) / stepV) * stepV;
                        seed[pKey] = Number(clamp(sVal, minV, maxV).toFixed(4));
                        return;
                    }
                    const kl = pKey.toLowerCase();
                    let val = defV;
                    if (kl === 'kp' || kl.startsWith('kp_') || kl === 'k1' || kl === 'kc') {
                        val = Math.max(defV, m * wn_desired * wn_desired - k);
                    } else if (kl === 'kd' || kl.startsWith('kd_') || kl === 'kv' || kl === 'k2') {
                        val = Math.max(defV * 0.9, 2 * zeta_desired * m * wn_desired - c);
                    } else if (kl === 'ki' || kl.startsWith('ki_')) {
                        val = hasDist ? Math.max(defV, 14.0) : defV * 0.6;
                    } else if (kl === 'b0') {
                        val = 1.0 / m;
                    } else if (kl === 'm_nom' || kl === 'm_est' || kl === 'mn') {
                        val = m;
                    }
                    const snapped = Math.round(clamp(val, minV, maxV) / stepV) * stepV;
                    seed[pKey] = Number(clamp(snapped, minV, maxV).toFixed(4));
                });

                return { seed, ruleName };
            };

            const computeOptimalGainsForMethod = (targetMethod, startParams) => {
                const conf = CONTROLLER_CONFIGS[targetMethod];
                if (!conf || !conf.params) return { bestParams: startParams, improvePct: 0, bestCost: 0, ruleName: '默认' };

                const cfg = loopStateRef.current;
                const pP = cfg.physParams;
                const paramEntries = Object.entries(conf.params);
                const initRad = (cfg.initialThetaDeg || 0) * Math.PI / 180;

                // 评估给定增益参数向量在当前物理系统下的综合控制性能泛函 J (ITAE + ISE + 超调惩罚 + 能耗 + 抖振惩罚)
                const evaluateCandidate = (candParams) => {
                    const simSt = {
                        x: cfg.initialX, v: 0, theta: initRad, omega: 0, t: 0,
                        alg: createFreshAlgState(pP.target, cfg.initialX)
                    };
                    let costJ = 0;
                    let u_last = 0;
                    const horizonSteps = 200; // 4.0秒完整闭环轨迹推演
                    for (let step = 0; step < horizonSteps; step++) {
                        let activeTarget = pP.target;
                        if (cfg.targetMode === 'sine') activeTarget = 5.0 + 4.0 * Math.sin(1.0 * simSt.t);
                        else if (cfg.targetMode === 'square') activeTarget = 5.0 + 3.0 * Math.sign(Math.sin(0.5 * simSt.t));

                        const u = stepChannel(simSt, targetMethod, candParams, pP, activeTarget, cfg.contDisturbance, 0, 0, cfg);
                        const err = Math.abs(activeTarget - simSt.x);
                        const du = u - u_last;
                        u_last = u;

                        // ITAE (时间加权误差) + ISE (平方误差) + 倒立摆倾角惩罚 + 控制能耗与抖振平滑惩罚
                        costJ += (1.0 + 2.8 * simSt.t) * err * DT + 3.5 * err * err * DT;
                        if (cfg.plantType === 'pendulum') {
                            costJ += 65.0 * (simSt.theta * simSt.theta) * DT + 8.0 * (simSt.omega * simSt.omega) * DT;
                        }
                        costJ += 0.0005 * (u * u) * DT + 0.0018 * (du * du) * DT;
                    }
                    // 严厉惩罚超调量与末端稳态残差
                    const overPct = simSt.alg.max_overshoot || 0;
                    const finalErr = Math.abs(pP.target - simSt.x);
                    const finalVel = Math.abs(simSt.v);
                    costJ += 0.45 * overPct * overPct + 45.0 * finalErr * finalErr + 8.0 * finalVel * finalVel;
                    return Number.isFinite(costJ) ? costJ : 1e9;
                };

                // 构造初始候选集：当前参数、默认参数、以及基于控制理论分支的解析最优种子点
                let bestParams = { ...startParams };
                let bestCost = evaluateCandidate(bestParams);
                const initCost = bestCost;

                const defParams = getDefaultParams(targetMethod);
                const defCost = evaluateCandidate(defParams);
                if (defCost < bestCost) {
                    bestCost = defCost;
                    bestParams = { ...defParams };
                }

                const { seed: analyticalSeed, ruleName } = getTheoreticalOptimalSeed(targetMethod, pP, cfg);
                const seedCost = evaluateCandidate(analyticalSeed);
                if (seedCost < bestCost) {
                    bestCost = seedCost;
                    bestParams = { ...analyticalSeed };
                }

                // 多尺度坐标模式搜索 (Multi-Scale Coordinate Pattern Search)
                const scaleMultipliers = [0.35, 0.55, 0.75, 0.88, 1.12, 1.28, 1.55, 1.9, 2.4];
                for (let round = 0; round < 3; round++) {
                    for (const [key, [defV, minV, maxV, stepV]] of paramEntries) {
                        const currVal = bestParams[key];
                        const span = maxV - minV;
                        const candidates = new Set();

                        scaleMultipliers.forEach(mul => {
                            const v = currVal * mul;
                            const snapped = Math.round(clamp(v, minV, maxV) / stepV) * stepV;
                            candidates.add(Number(clamp(snapped, minV, maxV).toFixed(4)));
                        });
                        [-6, -3, -2, -1, 1, 2, 3, 6].forEach(deltaSteps => {
                            const factor = round === 0 ? 3 : (round === 1 ? 2 : 1);
                            const v = currVal + deltaSteps * factor * stepV;
                            const snapped = Math.round(clamp(v, minV, maxV) / stepV) * stepV;
                            candidates.add(Number(clamp(snapped, minV, maxV).toFixed(4)));
                        });
                        if (round === 0) {
                            [0.15, 0.3, 0.5, 0.7, 0.85].forEach(q => {
                                const v = minV + q * span;
                                const snapped = Math.round(clamp(v, minV, maxV) / stepV) * stepV;
                                candidates.add(Number(clamp(snapped, minV, maxV).toFixed(4)));
                            });
                        }

                        for (const candVal of candidates) {
                            const trialParams = { ...bestParams, [key]: candVal };
                            const cCost = evaluateCandidate(trialParams);
                            if (cCost < bestCost) {
                                bestCost = cCost;
                                bestParams = trialParams;
                            }
                        }
                    }
                }

                const improvePct = initCost > 1e-4 ? Math.max(0, ((initCost - bestCost) / initCost) * 100) : 0;
                return { bestParams, improvePct, bestCost, ruleName };
            };

            const handleSolveOptimalCurrent = () => {
                const targetChannel = (compareMode && activeEditTab === 'B') ? 'B' : 'A';
                const targetM = targetChannel === 'B' ? methodB : method;
                const startP = targetChannel === 'B' ? ctrlParamsB : ctrlParams;
                const { bestParams, improvePct, ruleName } = computeOptimalGainsForMethod(targetM, startP);

                if (targetChannel === 'B') {
                    setCtrlParamsB(bestParams);
                } else {
                    setCtrlParams(bestParams);
                }
                resetSim(method, methodB, physParams.target, initialX, initialThetaDeg);
                const mName = CONTROLLER_CONFIGS[targetM]?.name.split(' ')[0] || targetM;
                setOptStatusMsg(`✨ 已按「${ruleName}」求解 ${mName} 最优增益${improvePct > 0.5 ? ` (综合性能指标提升 ${improvePct.toFixed(1)}%)` : ' (当前已处于最优参数邻域)'}`);
            };

            const handleSolveOptimalBoth = () => {
                const resA = computeOptimalGainsForMethod(method, ctrlParams);
                const resB = computeOptimalGainsForMethod(methodB, ctrlParamsB);
                setCtrlParams(resA.bestParams);
                setCtrlParamsB(resB.bestParams);
                resetSim(method, methodB, physParams.target, initialX, initialThetaDeg);
                setOptStatusMsg(`✨ 已按各自理论最优律同步求解 A[${CONTROLLER_CONFIGS[method]?.name.split(' ')[0]}] & B[${CONTROLLER_CONFIGS[methodB]?.name.split(' ')[0]}] 最优增益！`);
            };

            const updatePhysics = () => {
                const cfg = loopStateRef.current;
                const { physParams: pP, ctrlParams: cP, ctrlParamsB: cPB, method: currMethod, methodB: currMethodB, targetMode: tMode, contDisturbance: cDist, sensorNoise: sNoise, compareMode: isComp } = cfg;

                const stA = stateRef.current;
                const stB = stateBRef.current;

                let activeTarget = pP.target;
                if (tMode === 'sine') activeTarget = 5.0 + 4.0 * Math.sin(1.0 * stA.t);
                else if (tMode === 'square') activeTarget = 5.0 + 3.0 * Math.sign(Math.sin(0.5 * stA.t));

                const nx = sNoise > 0 ? sNoise * gaussNoise() : 0;
                const nv = sNoise > 0 ? (sNoise * 2.0) * gaussNoise() : 0;

                let ext_f = cDist;
                if (impulseRef.current > 0) {
                    ext_f += impulseRef.current;
                    impulseRef.current *= 0.8;
                    if (impulseRef.current < 1.0) impulseRef.current = 0;
                }

                const uA = stepChannel(stA, currMethod, cP, pP, activeTarget, ext_f, nx, nv, cfg);
                let uB = 0;
                if (isComp) {
                    uB = stepChannel(stB, currMethodB, cPB, pP, activeTarget, ext_f, nx, nv, cfg);
                }

                if (stA.alg.ticks % 5 === 0) {
                    const rmseA = stA.alg.ticks ? Math.sqrt(stA.alg.rmse_sum / stA.alg.ticks).toFixed(3) : '0.000';
                    const energyA = (stA.alg.energy || 0).toFixed(1);
                    const overA = (stA.alg.max_overshoot || 0).toFixed(1);
                    const thetaA = (stA.theta * 180 / Math.PI).toFixed(1);
                    const errA = Math.abs(activeTarget - stA.x).toFixed(2);

                    const rmseB = stB.alg.ticks ? Math.sqrt(stB.alg.rmse_sum / stB.alg.ticks).toFixed(3) : '0.000';
                    const energyB = (stB.alg.energy || 0).toFixed(1);
                    const overB = (stB.alg.max_overshoot || 0).toFixed(1);
                    const thetaB = (stB.theta * 180 / Math.PI).toFixed(1);
                    const errB = Math.abs(activeTarget - stB.x).toFixed(2);

                    setMetricsSnapshot({ rmseA, energyA, overA, thetaA, errA, rmseB, energyB, overB, thetaB, errB });
                }

                const errA = Math.abs(stA.x - pP.target) + Math.abs(stA.theta);
                const absVA = Math.abs(stA.v) + Math.abs(stA.omega);
                const errB = isComp ? (Math.abs(stB.x - pP.target) + Math.abs(stB.theta)) : 0;
                const absVB = isComp ? (Math.abs(stB.v) + Math.abs(stB.omega)) : 0;

                if (tMode === 'step' && errA < 0.04 && absVA < 0.04 && errB < 0.04 && absVB < 0.04) {
                    chartStateRef.current.freezeTimer += DT;
                } else {
                    chartStateRef.current.freezeTimer = 0;
                    chartStateRef.current.frozen = false;
                }

                if (chartStateRef.current.freezeTimer > 2.0 && impulseRef.current === 0) {
                    chartStateRef.current.frozen = true;
                }

                if (!chartStateRef.current.frozen) {
                    historyRef.current.push({
                        t: stA.t,
                        x: stA.x, v: stA.v, u: uA, theta: stA.theta, omega: stA.omega,
                        xB: stB.x, vB: stB.v, uB: uB, thetaB: stB.theta, omegaB: stB.omega,
                        target: activeTarget,
                        ref: stA.alg.ref_display !== undefined ? stA.alg.ref_display : stA.alg.xm,
                        refB: stB.alg.ref_display !== undefined ? stB.alg.ref_display : stB.alg.xm
                    });
                    if (historyRef.current.length > 2500) {
                        historyRef.current.shift();
                    }
                }
            };

            const animate = () => {
                if (loopStateRef.current.running) updatePhysics();
                drawSimulation();
                drawCharts();
                requestRef.current = requestAnimationFrame(animate);
            };

            // 初始欢迎页面：高质感动态相空间轨迹流形背景动画
            useEffect(() => {
                if (!showLandingPage) return;
                const canvas = landingCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                let tick = 0;

                const particles = Array.from({ length: 28 }, (_, i) => ({
                    x: (i % 7) * 0.28 - 0.85 + (Math.random() - 0.5) * 0.15,
                    v: Math.floor(i / 7) * 0.45 - 0.68 + (Math.random() - 0.5) * 0.15,
                    trail: [],
                    hue: 162 + (i % 5) * 8
                }));

                const renderLandingBg = () => {
                    tick += 0.016;
                    const w = canvas.width;
                    const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    // 柔和坐标网格与相平面等势椭圆
                    ctx.strokeStyle = 'rgba(13, 148, 136, 0.08)';
                    ctx.lineWidth = 1;
                    const gridStep = 48;
                    for (let gx = 0; gx < w; gx += gridStep) {
                        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
                    }
                    for (let gy = 0; gy < h; gy += gridStep) {
                        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
                    }

                    const cx = w * 0.5;
                    const cy = h * 0.48;

                    // 绘制李雅普诺夫等值面 V(x,v) = c 与滑模流形线 s = c*x + v = 0
                    [90, 175, 270, 380].forEach((r, idx) => {
                        ctx.beginPath();
                        ctx.ellipse(cx, cy, r * 1.45, r * 0.72, -0.22 + Math.sin(tick * 0.25 + idx) * 0.03, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(15, 118, 110, ${0.11 - idx * 0.02})`;
                        ctx.setLineDash([6, 6]);
                        ctx.stroke();
                    });
                    ctx.setLineDash([]);

                    // 绘制滑模切换超平面 s = cx + v = 0
                    ctx.beginPath();
                    ctx.moveTo(cx - 520, cy + 210);
                    ctx.lineTo(cx + 520, cy - 210);
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.16)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // 更新并绘制相空间收敛轨迹粒子
                    particles.forEach((p) => {
                        const dt_p = 0.028;
                        const u_ctrl = -2.2 * p.x - 1.35 * p.v - 0.35 * Math.tanh(4.0 * (1.2 * p.x + p.v));
                        const acc = u_ctrl + 0.12 * Math.sin(tick * 1.2);
                        p.v += acc * dt_p;
                        p.x += p.v * dt_p;

                        const sx = cx + p.x * (w * 0.42);
                        const sy = cy - p.v * (h * 0.36);
                        p.trail.push({ x: sx, y: sy });
                        if (p.trail.length > 38) p.trail.shift();

                        if (Math.hypot(p.x, p.v) < 0.035 || Math.abs(p.x) > 1.35 || Math.abs(p.v) > 1.35) {
                            const angle = Math.random() * Math.PI * 2;
                            const rad = 0.65 + Math.random() * 0.45;
                            p.x = Math.cos(angle) * rad;
                            p.v = Math.sin(angle) * rad;
                            p.trail = [];
                        }

                        if (p.trail.length > 2) {
                            ctx.beginPath();
                            ctx.moveTo(p.trail[0].x, p.trail[0].y);
                            for (let k = 1; k < p.trail.length; k++) {
                                ctx.lineTo(p.trail[k].x, p.trail[k].y);
                            }
                            ctx.strokeStyle = `hsla(${p.hue}, 72%, 34%, 0.24)`;
                            ctx.lineWidth = 1.8;
                            ctx.stroke();

                            const head = p.trail[p.trail.length - 1];
                            ctx.beginPath();
                            ctx.arc(head.x, head.y, 2.6, 0, Math.PI * 2);
                            ctx.fillStyle = `hsla(${p.hue}, 80%, 30%, 0.45)`;
                            ctx.fill();
                        }
                    });

                    animId = requestAnimationFrame(renderLandingBg);
                };

                animId = requestAnimationFrame(renderLandingBg);
                return () => cancelAnimationFrame(animId);
            }, [showLandingPage]);

            useEffect(() => {
                resetSim(method, methodB, physParams.target, initialX, initialThetaDeg);
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, []);

            const drawSpring = (ctx, x1, x2, y, color = '#94a3b8') => {
                ctx.beginPath();
                ctx.moveTo(x1, y);
                const span = Math.max(20, x2 - x1);
                const segments = 22;
                const step = span / segments;
                for (let i = 1; i < segments; i++) {
                    ctx.lineTo(x1 + step * i, y + (i % 2 === 0 ? 5 : -5));
                }
                ctx.lineTo(x2, y);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            };

            const drawCartPendulum = (ctx, cartX, theta, omega, groundY, rodLenPx, colorMain, colorDark, labelPrefix, isImpulsed, alpha = 1.0) => {
                ctx.save();
                ctx.globalAlpha = alpha;
                const cartW = 60, cartH = 22, wheelR = 6;
                const cartTopY = groundY - wheelR * 2 - cartH;
                const pivotX = cartX;
                const pivotY = cartTopY + 3;

                ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([2, 2]);
                const stopLen = 24;
                [-1.047, 1.047].forEach(ang => {
                    ctx.beginPath();
                    ctx.moveTo(pivotX, pivotY);
                    ctx.lineTo(pivotX + Math.sin(ang) * stopLen, pivotY - Math.cos(ang) * stopLen);
                    ctx.stroke();
                });
                ctx.setLineDash([]);

                ctx.beginPath();
                ctx.setLineDash([3, 3]);
                ctx.moveTo(pivotX, pivotY);
                ctx.lineTo(pivotX, pivotY - rodLenPx - 10);
                ctx.strokeStyle = 'rgba(100, 116, 139, 0.35)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);

                if (Math.abs(theta) > 0.015) {
                    ctx.beginPath();
                    const startAng = -Math.PI / 2;
                    const endAng = -Math.PI / 2 + theta;
                    ctx.arc(pivotX, pivotY, 22, Math.min(startAng, endAng), Math.max(startAng, endAng));
                    ctx.strokeStyle = colorMain;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.shadowColor = isImpulsed ? 'rgba(244,63,94,0.35)' : 'rgba(15,23,42,0.12)';
                ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
                ctx.fillStyle = isImpulsed ? '#ef4444' : colorMain;
                ctx.beginPath();
                ctx.roundRect(cartX - cartW / 2, cartTopY, cartW, cartH, 5);
                ctx.fill();
                ctx.shadowColor = 'transparent';

                ctx.fillStyle = '#334155';
                [-cartW / 3, cartW / 3].forEach(wx => {
                    ctx.beginPath();
                    ctx.arc(cartX + wx, groundY - wheelR, wheelR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#cbd5e1';
                    ctx.beginPath();
                    ctx.arc(cartX + wx, groundY - wheelR, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#334155';
                });

                const bobX = pivotX + Math.sin(theta) * rodLenPx;
                const bobY = pivotY - Math.cos(theta) * rodLenPx;

                ctx.beginPath();
                ctx.moveTo(pivotX, pivotY);
                ctx.lineTo(bobX, bobY);
                ctx.strokeStyle = colorDark;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = colorDark;
                ctx.lineWidth = 1.8;
                ctx.stroke();

                const bobRadius = 10;
                ctx.fillStyle = isImpulsed ? '#f43f5e' : colorMain;
                ctx.beginPath();
                ctx.arc(bobX, bobY, bobRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                const degStr = (theta * 180 / Math.PI).toFixed(1) + '°';
                ctx.fillText(`${labelPrefix}${degStr}`, cartX, cartTopY + 15);
                ctx.restore();
            };

            const drawSimulation = () => {
                const canvas = simCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;
                const { plantType: pType, compareMode: isComp, physParams: pP, targetMode: tMode, method: mA, methodB: mB } = loopStateRef.current;

                ctx.clearRect(0, 0, w, h);
                const mapX = (val) => ((val + 2) / 14) * w;
                const groundY = h - 26;

                ctx.beginPath(); ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)'; ctx.lineWidth = 1;
                for (let i = 0; i <= 14; i++) {
                    const px = (i / 14) * w;
                    ctx.moveTo(px, 0); ctx.lineTo(px, groundY);
                }
                for (let i = 0; i <= 4; i++) {
                    const py = (i / 4) * groundY;
                    ctx.moveTo(0, py); ctx.lineTo(w, py);
                }
                ctx.stroke();

                ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY);
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif';
                for (let i = 0; i <= 10; i += 1) {
                    const px = mapX(i);
                    ctx.fillRect(px, groundY, 2, 4);
                    ctx.fillText(i + 'm', px - 6, groundY + 14);
                }

                let activeTarget = pP.target;
                if (tMode === 'sine') activeTarget = 5.0 + 4.0 * Math.sin(1.0 * stateRef.current.t);
                else if (tMode === 'square') activeTarget = 5.0 + 3.0 * Math.sign(Math.sin(0.5 * stateRef.current.t));
                const targetX = mapX(activeTarget);

                ctx.beginPath(); ctx.setLineDash([5, 4]); ctx.moveTo(targetX, 14); ctx.lineTo(targetX, groundY);
                ctx.strokeStyle = '#10B981'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);

                ctx.fillStyle = '#10B981';
                ctx.beginPath(); ctx.moveTo(targetX, groundY); ctx.lineTo(targetX - 5, groundY - 7); ctx.lineTo(targetX + 5, groundY - 7); ctx.fill();
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText('TARGET', targetX - 18, 11);

                const isImpulsed = impulseRef.current > 10;

                if (pType === 'slider') {
                    if (!isComp) {
                        const blockX = mapX(stateRef.current.x);
                        const boxSize = 36;
                        drawSpring(ctx, 0, blockX - boxSize / 2, groundY - boxSize / 2, '#94a3b8');

                        ctx.fillStyle = isImpulsed ? '#ef4444' : '#3b82f6';
                        ctx.beginPath();
                        ctx.roundRect(blockX - boxSize / 2, groundY - boxSize, boxSize, boxSize, 6);
                        ctx.fill();

                        ctx.fillStyle = 'white'; ctx.font = 'bold 10px sans-serif';
                        ctx.fillText(stateRef.current.x.toFixed(2) + 'm', blockX - 16, groundY - boxSize / 2 + 4);
                    } else {
                        const trackAY = groundY - 44;
                        const trackBY = groundY;
                        const boxH = 28, boxW = 38;

                        ctx.beginPath(); ctx.moveTo(0, trackAY); ctx.lineTo(w, trackAY);
                        ctx.strokeStyle = 'rgba(59, 130, 246, 0.25)'; ctx.lineWidth = 1.2; ctx.stroke();

                        const blockAX = mapX(stateRef.current.x);
                        const blockBX = mapX(stateBRef.current.x);

                        drawSpring(ctx, 0, blockAX - boxW / 2, trackAY - boxH / 2, '#60a5fa');
                        drawSpring(ctx, 0, blockBX - boxW / 2, trackBY - boxH / 2, '#fbbf24');

                        ctx.fillStyle = isImpulsed ? '#ef4444' : '#3b82f6';
                        ctx.beginPath(); ctx.roundRect(blockAX - boxW / 2, trackAY - boxH, boxW, boxH, 5); ctx.fill();
                        ctx.fillStyle = 'white'; ctx.font = 'bold 9px sans-serif';
                        ctx.fillText('A:' + stateRef.current.x.toFixed(2), blockAX - 16, trackAY - boxH / 2 + 3);

                        ctx.fillStyle = isImpulsed ? '#f97316' : '#f59e0b';
                        ctx.beginPath(); ctx.roundRect(blockBX - boxW / 2, trackBY - boxH, boxW, boxH, 5); ctx.fill();
                        ctx.fillStyle = 'white'; ctx.font = 'bold 9px sans-serif';
                        ctx.fillText('B:' + stateBRef.current.x.toFixed(2), blockBX - 16, trackBY - boxH / 2 + 3);

                        ctx.fillStyle = '#1e40af'; ctx.font = 'bold 10px sans-serif';
                        ctx.fillText(`● A: ${CONTROLLER_CONFIGS[mA]?.name || mA}`, 10, 16);
                        ctx.fillStyle = '#b45309';
                        ctx.fillText(`● B: ${CONTROLLER_CONFIGS[mB]?.name || mB}`, 10, 30);
                    }
                } else {
                    const rodLenPx = clamp((pP.l || 1.5) * 44, 38, h - 68);
                    const cartAX = mapX(stateRef.current.x);

                    if (isComp) {
                        const cartBX = mapX(stateBRef.current.x);
                        drawCartPendulum(ctx, cartBX, stateBRef.current.theta, stateBRef.current.omega, groundY, rodLenPx, '#f59e0b', '#b45309', 'B:', isImpulsed, 0.85);
                        drawCartPendulum(ctx, cartAX, stateRef.current.theta, stateRef.current.omega, groundY, rodLenPx, '#3b82f6', '#1d4ed8', 'A:', isImpulsed, 0.95);

                        ctx.fillStyle = '#1e40af'; ctx.font = 'bold 10px sans-serif';
                        ctx.fillText(`● A (${CONTROLLER_CONFIGS[mA]?.name.split(' ')[0]}): x=${stateRef.current.x.toFixed(2)}m, θ=${(stateRef.current.theta * 180 / Math.PI).toFixed(1)}°`, 10, 16);
                        ctx.fillStyle = '#b45309';
                        ctx.fillText(`● B (${CONTROLLER_CONFIGS[mB]?.name.split(' ')[0]}): x=${stateBRef.current.x.toFixed(2)}m, θ=${(stateBRef.current.theta * 180 / Math.PI).toFixed(1)}°`, 10, 30);
                    } else {
                        drawCartPendulum(ctx, cartAX, stateRef.current.theta, stateRef.current.omega, groundY, rodLenPx, '#3b82f6', '#1e40af', '', isImpulsed, 1.0);
                        ctx.fillStyle = '#0f766e'; ctx.font = 'bold 10px monospace';
                        ctx.fillText(`x: ${stateRef.current.x.toFixed(2)}m | θ: ${(stateRef.current.theta * 180 / Math.PI).toFixed(2)}° | ω: ${stateRef.current.omega.toFixed(2)}rad/s`, 10, 16);
                        if (Math.abs(stateRef.current.theta) >= 1.04) {
                            ctx.fillStyle = '#e11d48'; ctx.font = 'bold 10px sans-serif';
                            ctx.fillText('⚠️ 触碰 ±60° 机械安全限位', 10, 30);
                        }
                    }
                }
            };

            const renderPositionChart = (canvas, channelMode, showGhost) => {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                ctx.strokeStyle = 'rgba(226, 232, 240, 0.75)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 1; i < 4; i++) {
                    ctx.moveTo(0, (h * i) / 4); ctx.lineTo(w, (h * i) / 4);
                }
                for (let i = 1; i < 6; i++) {
                    ctx.moveTo((w * i) / 6, 0); ctx.lineTo((w * i) / 6, h);
                }
                ctx.stroke();

                const pts = historyRef.current;
                if (pts.length < 2) return;

                const t_start = pts[0].t;
                const t_end = pts[pts.length - 1].t;
                const t_span = Math.max(6.0, t_end - t_start);
                const POS_OFFSET = 5;
                const POS_SCALE = h / 22;
                const isPend = loopStateRef.current.plantType === 'pendulum';

                const plotKey = (key, color, isDash = false, lw = 2.2) => {
                    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = lw;
                    if (isDash) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
                    pts.forEach((pt, i) => {
                        const px = ((pt.t - t_start) / t_span) * w;
                        const py = (h / 2) - ((pt[key] || 0) - POS_OFFSET) * POS_SCALE;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    });
                    ctx.stroke(); ctx.setLineDash([]);
                };

                plotKey('target', '#10B981', false, 1.6);

                if (channelMode === 'A') {
                    if (loopStateRef.current.compareMode && showGhost) {
                        plotKey('xB', 'rgba(245, 158, 11, 0.38)', true, 1.5);
                    }
                    plotKey('x', '#2563eb', false, 2.6);
                    if (isPend) {
                        ctx.beginPath(); ctx.strokeStyle = 'rgba(139, 92, 246, 0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
                        pts.forEach((pt, i) => {
                            const px = ((pt.t - t_start) / t_span) * w;
                            const py = (h / 2) - (pt.theta || 0) * (h / 4.2);
                            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                        });
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    const mA = loopStateRef.current.method;
                    if (['PPC', 'Funnel-Control', 'TimeVary-BLF'].includes(mA)) {
                        ctx.beginPath(); ctx.strokeStyle = '#e879f9'; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
                        pts.forEach((pt, i) => {
                            const px = ((pt.t - t_start) / t_span) * w;
                            const py = (h / 2) - (pt.target + (pt.ref || 1) - POS_OFFSET) * POS_SCALE;
                            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                        });
                        ctx.stroke();
                        ctx.beginPath();
                        pts.forEach((pt, i) => {
                            const px = ((pt.t - t_start) / t_span) * w;
                            const py = (h / 2) - (pt.target - (pt.ref || 1) - POS_OFFSET) * POS_SCALE;
                            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                        });
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    const rmseA = stateRef.current.alg.ticks ? Math.sqrt(stateRef.current.alg.rmse_sum / stateRef.current.alg.ticks).toFixed(3) : '0.000';
                    const overA = (stateRef.current.alg.max_overshoot || 0).toFixed(1);
                    ctx.fillStyle = '#1e40af'; ctx.font = 'bold 12px monospace';
                    ctx.fillText(`x_A=${stateRef.current.x.toFixed(2)}m | RMSE=${rmseA} | 超调=${overA}%`, 10, h - 8);
                } else if (channelMode === 'B') {
                    if (showGhost) {
                        plotKey('x', 'rgba(37, 99, 235, 0.32)', true, 1.5);
                    }
                    plotKey('xB', '#d97706', false, 2.6);
                    if (isPend) {
                        ctx.beginPath(); ctx.strokeStyle = 'rgba(180, 83, 9, 0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
                        pts.forEach((pt, i) => {
                            const px = ((pt.t - t_start) / t_span) * w;
                            const py = (h / 2) - (pt.thetaB || 0) * (h / 4.2);
                            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                        });
                        ctx.stroke(); ctx.setLineDash([]);
                    }
                    const rmseB = stateBRef.current.alg.ticks ? Math.sqrt(stateBRef.current.alg.rmse_sum / stateBRef.current.alg.ticks).toFixed(3) : '0.000';
                    const overB = (stateBRef.current.alg.max_overshoot || 0).toFixed(1);
                    ctx.fillStyle = '#b45309'; ctx.font = 'bold 12px monospace';
                    ctx.fillText(`x_B=${stateBRef.current.x.toFixed(2)}m | RMSE=${rmseB} | 超调=${overB}%`, 10, h - 8);
                } else {
                    plotKey('xB', '#f59e0b', false, 2.4);
                    plotKey('x', '#2563eb', false, 2.6);
                    const rmseA = stateRef.current.alg.ticks ? Math.sqrt(stateRef.current.alg.rmse_sum / stateRef.current.alg.ticks).toFixed(3) : '0.000';
                    const rmseB = stateBRef.current.alg.ticks ? Math.sqrt(stateBRef.current.alg.rmse_sum / stateBRef.current.alg.ticks).toFixed(3) : '0.000';
                    ctx.fillStyle = '#1e40af'; ctx.font = 'bold 11px monospace';
                    ctx.fillText(`A RMSE: ${rmseA}`, 10, h - 22);
                    ctx.fillStyle = '#b45309';
                    ctx.fillText(`B RMSE: ${rmseB}`, 10, h - 8);
                }
            };

            const renderPhaseChart = (canvas, channelMode, showGhost) => {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                ctx.strokeStyle = 'rgba(226, 232, 240, 0.85)'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
                ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
                ctx.stroke();

                const pts = historyRef.current;
                if (pts.length < 2) return;

                const isComp = loopStateRef.current.compareMode;
                const allX = isComp ? [...pts.map(p => p.x), ...pts.map(p => p.xB)] : pts.map(p => p.x);
                const allV = isComp ? [...pts.map(p => p.v), ...pts.map(p => p.vB)] : pts.map(p => p.v);
                const minX = Math.min(...allX, -2); const maxX = Math.max(...allX, 12);
                const minV = Math.min(...allV, -8); const maxV = Math.max(...allV, 8);
                const rangeX = Math.max(maxX - minX, 5) * 1.2;
                const rangeV = Math.max(maxV - minV, 5) * 1.2;
                const centerX = (maxX + minX) / 2;
                const centerV = (maxV + minV) / 2;
                const mapPX = (x) => w / 2 + ((x - centerX) / rangeX) * w;
                const mapPY = (v) => h / 2 - ((v - centerV) / rangeV) * h;

                const drawTraj = (xKey, vKey, strokeCol, dotCol, isDash = false, lw = 2.0) => {
                    ctx.beginPath(); ctx.strokeStyle = strokeCol; ctx.lineWidth = lw;
                    if (isDash) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
                    pts.forEach((pt, i) => {
                        const px = mapPX(pt[xKey] || 0); const py = mapPY(pt[vKey] || 0);
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    });
                    ctx.stroke(); ctx.setLineDash([]);
                    const last = pts[pts.length - 1];
                    ctx.beginPath(); ctx.fillStyle = dotCol;
                    ctx.arc(mapPX(last[xKey] || 0), mapPY(last[vKey] || 0), 4.5, 0, Math.PI * 2);
                    ctx.fill();
                };

                if (channelMode === 'A') {
                    if (isComp && showGhost) drawTraj('xB', 'vB', 'rgba(245, 158, 11, 0.32)', 'rgba(217, 119, 6, 0.4)', true, 1.4);
                    drawTraj('x', 'v', '#7c3aed', '#2563eb', false, 2.2);
                    ctx.fillStyle = '#4c1d95'; ctx.font = 'bold 11px monospace';
                    ctx.fillText(`v_A=${stateRef.current.v.toFixed(2)}m/s`, 10, h - 8);
                } else if (channelMode === 'B') {
                    if (showGhost) drawTraj('x', 'v', 'rgba(124, 58, 237, 0.28)', 'rgba(37, 99, 235, 0.35)', true, 1.4);
                    drawTraj('xB', 'vB', '#d97706', '#b45309', false, 2.2);
                    ctx.fillStyle = '#b45309'; ctx.font = 'bold 11px monospace';
                    ctx.fillText(`v_B=${stateBRef.current.v.toFixed(2)}m/s`, 10, h - 8);
                } else {
                    drawTraj('xB', 'vB', '#f59e0b', '#d97706', false, 2.0);
                    drawTraj('x', 'v', '#7c3aed', '#2563eb', false, 2.2);
                }
            };

            const renderControlChart = (canvas, channelMode, showGhost) => {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                ctx.strokeStyle = 'rgba(226, 232, 240, 0.75)'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
                ctx.moveTo(0, h / 4); ctx.lineTo(w, h / 4);
                ctx.moveTo(0, (h * 3) / 4); ctx.lineTo(w, (h * 3) / 4);
                ctx.stroke();

                const pts = historyRef.current;
                if (pts.length < 2) return;

                const t_start = pts[0].t;
                const t_end = pts[pts.length - 1].t;
                const t_span = Math.max(6.0, t_end - t_start);
                const lim = loopStateRef.current.actuatorLimit || 200;
                const CTRL_SCALE = (h * 0.42) / Math.max(50, lim);

                const plotU = (uKey, color, isDash = false, lw = 2.0) => {
                    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = lw;
                    if (isDash) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
                    pts.forEach((pt, i) => {
                        const px = ((pt.t - t_start) / t_span) * w;
                        const py = (h / 2) - (pt[uKey] || 0) * CTRL_SCALE;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    });
                    ctx.stroke(); ctx.setLineDash([]);
                };

                if (channelMode === 'A') {
                    if (loopStateRef.current.compareMode && showGhost) plotU('uB', 'rgba(245, 158, 11, 0.35)', true, 1.4);
                    plotU('u', '#e11d48', false, 2.2);
                    const enA = (stateRef.current.alg.energy || 0).toFixed(1);
                    const lastUA = (pts[pts.length - 1]?.u || 0).toFixed(1);
                    ctx.fillStyle = '#be123c'; ctx.font = 'bold 12px monospace';
                    ctx.fillText(`u_A=${lastUA}N | ∫u²dt=${enA}J`, 10, h - 8);
                } else if (channelMode === 'B') {
                    if (showGhost) plotU('u', 'rgba(225, 29, 72, 0.28)', true, 1.4);
                    plotU('uB', '#d97706', false, 2.2);
                    const enB = (stateBRef.current.alg.energy || 0).toFixed(1);
                    const lastUB = (pts[pts.length - 1]?.uB || 0).toFixed(1);
                    ctx.fillStyle = '#b45309'; ctx.font = 'bold 12px monospace';
                    ctx.fillText(`u_B=${lastUB}N | ∫u²dt=${enB}J`, 10, h - 8);
                } else {
                    plotU('uB', '#f59e0b', false, 2.0);
                    plotU('u', '#e11d48', false, 2.2);
                    const enA = (stateRef.current.alg.energy || 0).toFixed(1);
                    const enB = (stateBRef.current.alg.energy || 0).toFixed(1);
                    ctx.fillStyle = '#be123c'; ctx.font = 'bold 11px monospace';
                    ctx.fillText(`A Energy: ${enA}J`, 10, h - 22);
                    ctx.fillStyle = '#b45309';
                    ctx.fillText(`B Energy: ${enB}J`, 10, h - 8);
                }
            };

            const drawCharts = () => {
                const { compareMode: isComp, compareChartLayout: cLayout, focusMetric: fMetric, showGhostRef: ghost, zoomedChart: zChart } = loopStateRef.current;

                if (!isComp) {
                    renderPositionChart(posChartCanvasRef.current, 'A', false);
                    renderPhaseChart(phaseChartCanvasRef.current, 'A', false);
                    renderControlChart(ctrlChartCanvasRef.current, 'A', false);
                } else if (cLayout === 'split') {
                    renderPositionChart(posChartCanvasRef.current, 'A', ghost);
                    renderPhaseChart(phaseChartCanvasRef.current, 'A', ghost);
                    renderControlChart(ctrlChartCanvasRef.current, 'A', ghost);

                    renderPositionChart(posChartBCanvasRef.current, 'B', ghost);
                    renderPhaseChart(phaseChartBCanvasRef.current, 'B', ghost);
                    renderControlChart(ctrlChartBCanvasRef.current, 'B', ghost);
                } else if (cLayout === 'focus') {
                    if (fMetric === 'pos') {
                        renderPositionChart(posChartCanvasRef.current, 'A', ghost);
                        renderPositionChart(posChartBCanvasRef.current, 'B', ghost);
                    } else if (fMetric === 'phase') {
                        renderPhaseChart(posChartCanvasRef.current, 'A', ghost);
                        renderPhaseChart(posChartBCanvasRef.current, 'B', ghost);
                    } else {
                        renderControlChart(posChartCanvasRef.current, 'A', ghost);
                        renderControlChart(posChartBCanvasRef.current, 'B', ghost);
                    }
                } else {
                    renderPositionChart(posChartCanvasRef.current, 'AB', false);
                    renderPhaseChart(phaseChartCanvasRef.current, 'AB', false);
                    renderControlChart(ctrlChartCanvasRef.current, 'AB', false);
                }

                if (zChart && zoomCanvasRef.current) {
                    if (zChart.type === 'pos') renderPositionChart(zoomCanvasRef.current, zChart.channel, ghost);
                    else if (zChart.type === 'phase') renderPhaseChart(zoomCanvasRef.current, zChart.channel, ghost);
                    else renderControlChart(zoomCanvasRef.current, zChart.channel, ghost);
                }
            };

            const resetSim = (mA = method, mB = methodB, target = physParams.target, initX = initialX, initThDeg = initialThetaDeg) => {
                const rad = (initThDeg || 0) * Math.PI / 180;
                stateRef.current = {
                    x: initX, v: 0, theta: rad, omega: 0, t: 0,
                    alg: createFreshAlgState(target, initX)
                };
                stateBRef.current = {
                    x: initX, v: 0, theta: rad, omega: 0, t: 0,
                    alg: createFreshAlgState(target, initX)
                };
                historyRef.current = [];
                chartStateRef.current = { frozen: false, freezeTimer: 0 };
                impulseRef.current = 0;
                setRunning(true);
            };

            const handleMethodChange = (e) => {
                const newMethod = e.target.value;
                setMethod(newMethod);
                setCtrlParams(getDefaultParams(newMethod));
                setActiveEditTab('A');
                resetSim(newMethod, methodB, physParams.target, initialX, initialThetaDeg);
            };

            const handleMethodBChange = (e) => {
                const newMethodB = e.target.value;
                setMethodB(newMethodB);
                setCtrlParamsB(getDefaultParams(newMethodB));
                setActiveEditTab('B');
                resetSim(method, newMethodB, physParams.target, initialX, initialThetaDeg);
            };

            const applyPresetComparison = (pair) => {
                setCompareMode(true);
                setMethod(pair.a);
                setMethodB(pair.b);
                setCtrlParams(getDefaultParams(pair.a));
                setCtrlParamsB(getDefaultParams(pair.b));
                resetSim(pair.a, pair.b, physParams.target, initialX, initialThetaDeg);
            };

            const handleParamChange = (key, val, isPhys = false, channel = 'A') => {
                const num = parseFloat(val);
                if (isPhys) setPhysParams(prev => ({ ...prev, [key]: num }));
                else if (channel === 'B') setCtrlParamsB(prev => ({ ...prev, [key]: num }));
                else setCtrlParams(prev => ({ ...prev, [key]: num }));
                historyRef.current = [];
                chartStateRef.current = { frozen: false, freezeTimer: 0 };
            };

            const resetNonIdealities = () => {
                setActuatorLimit(200);
                setActuatorDeadzone(0);
                setPlantDelay(0);
                setCoulombFriction(0);
                setSensorNoise(0);
                setContDisturbance(0);
                chartStateRef.current.frozen = false;
                chartStateRef.current.freezeTimer = 0;
            };

            const { groupedMethods, sortedCategories, totalMethodCount } = useMemo(() => {
                const allEntries = Object.entries(CONTROLLER_CONFIGS);
                const q = searchQuery.trim().toLowerCase();
                const grouped = {};
                allEntries.forEach(([key, conf]) => {
                    if (!q || key.toLowerCase().includes(q) || conf.name.toLowerCase().includes(q) || conf.category.toLowerCase().includes(q) || conf.desc.toLowerCase().includes(q)) {
                        (grouped[conf.category] = grouped[conf.category] || []).push({ key, ...conf });
                    }
                });
                return {
                    groupedMethods: grouped,
                    sortedCategories: Object.keys(grouped).sort(),
                    totalMethodCount: allEntries.length
                };
            }, [searchQuery]);

            const activeViewMethod = (compareMode && activeEditTab === 'B') ? methodB : method;
            const activeViewParams = (compareMode && activeEditTab === 'B') ? ctrlParamsB : ctrlParams;
            const activeConfig = CONTROLLER_CONFIGS[activeViewMethod] || CONTROLLER_CONFIGS['PID'];
            const activePaper = activeConfig.paper || PAPER_CITATIONS[activeViewMethod] || PAPER_CITATIONS['PID'];
            const paperA = CONTROLLER_CONFIGS[method]?.paper || PAPER_CITATIONS[method] || PAPER_CITATIONS['PID'];

            return (

                        {/* 黄金比例中轴对称极简毛玻璃主卡片（严格中轴对齐、按钮绝不分两行） */}

                                >
                                    <span className="whitespace-nowrap">进入模拟器</span>

                                </button>

                        <button

                        >

                                            <div className="font-extrabold text-blue-800 mb-1">🎛️ 1. 左侧：控制律增益调节、最优求解与顶刊文献</div>
                                            <ul className="list-disc list-inside space-y-1 text-[11px] text-slate-600">
                                                <li><b>双列增益直调</b>：所有控制器参数采用双列紧凑滑块排布，拖动即可实时改变控制刚度与阻尼。</li>
                                                <li><b>✨ 最优增益求解</b>：内置闭环轨迹寻优器（基于 ITAE + ISE + 超调惩罚 + 能耗泛函 $J$），可根据当前物体的质量 $m$、刚度 $k$、摆长 $L$ 及风扰自动计算最优控制器增益。</li>
                                                <li><b>📄 权威顶刊/奠基论文</b>：每种算法均附带真实存在的顶刊/奠基论文出处（如 <i>Automatica</i>、<i>IEEE TAC</i>、<i>IEEE TIE</i>），点击 <b>访问原文 ↗</b> 即可直接打开论文页面。</li>
                                                <li><b>底层机理与调参指引</b>：一键切换查看公式中每个符号的物理意义、算法演进背景与工程整定口诀。</li>
                                            </ul>
                                        </div>

                                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                                            <div className="font-extrabold text-teal-800 mb-1">📈 2. 中间：物理动力学流形与多维状态观测器</div>
                                            <ul className="list-disc list-inside space-y-1 text-[11px] text-slate-600">
                                                <li><b>动力学动画窗</b>：直观展示滑块弹簧拉伸或倒立摆小车平衡过程。支持 <b>↕ 压缩动画放大曲线</b> 与 <b>隐藏侧栏全宽看图</b>。</li>
                                                <li><b>三合一状态观测曲线</b>：包含 <b>位置序列 $x(t)$</b>（含目标线、参考模型线、PPC安全漏斗、倒立摆角 $\theta$）、<b>相空间轨迹 ($v$ vs $x$)</b>（观察极限环与吸引子收敛）和 <b>执行器控制力 $u(t)$</b>（观察输出饱和与滑模抖振）。</li>
                                                <li><b>🔍 点击任意图表高清放大</b>：鼠标点击任意一幅曲线图，即可弹出全屏超高分辨率波形检视窗。</li>
                                            </ul>
                                        </div>

                                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                                            <div className="font-extrabold text-amber-800 mb-1">⚖️ 3. 顶部与中心：双算法同屏对比演示 (A vs B)</div>
                                            <ul className="list-disc list-inside space-y-1 text-[11px] text-slate-600">
                                                <li>点击顶部 <b>算法对比</b> 按钮即可开启双通道同屏竞技（蓝色通道 A vs 琥珀色通道 B），并提供 <b>10 组经典流派对比预设</b>。</li>
                                                <li><b>三种对比曲线视图</b>：默认采用 <b>🔀 A/B 独立分屏展示 (6图)</b>（上排独立展示 A 的三幅曲线，下排独立展示 B 的三幅曲线，可勾选“显示对方虚线参考影线”）；还可切换为 <b>🔍 单指标左右巨幅对比</b> 或 <b>叠 A+B 同屏叠加 (3图)</b>。</li>
                                                <li><b>⚡ A&B 同步最优增益求解</b>：在对比模式下可一键为 A 和 B 同时求解各自的最优参数，实现不同控制流派在最佳状态下的公平对决。</li>
                                            </ul>
                                        </div>

                                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                                            <div className="font-extrabold text-rose-800 mb-1">🔧 4. 右侧：外部环境、硬件非理想限制与物理属性</div>
                                            <ul className="list-disc list-inside space-y-1 text-[11px] text-slate-600">
                                                <li><b>目标与环境激励</b>：切换阶跃/正弦/方波指令，调节目标点、初始位置、恒定风扰及倒立摆初始倾角 $\theta_0$。</li>
                                                <li><b>硬件非理想限制</b>：测试算法在 <b>执行器饱和限幅</b>（检验抗积分饱和 AW-PI）、<b>控制死区</b>、<b>纯时间滞后</b>（检验 Smith 预估器与 Artstein 降阶）、<b>库仑干摩擦</b> 与 <b>传感器高斯白噪声</b>（检验卡尔曼滤波 LQG/EKF 与不完全微分 PID）下的鲁棒性。</li>
                                                <li><b>实时 KPI 评分表</b>：底部表格实时对比 RMSE（均方根误差）、累计控制能耗 $\int u^2 dt$、最大超调量 (%) 与实时摆角/误差。</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end pt-2 border-t border-slate-200">
                                    <button
                                        onClick={() => setShowGuideModal(false)}
                                        className="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-xs shadow-md transition-all"
                                    >
                                        我已了解，开始探索控制理论世界！
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* 全局控制符号词典模态框 */}
                {showGlossary && (
                    <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowGlossary(false)}>
                        <div className="bg-white/95 rounded-2xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-teal-200 modal-animate overflow-hidden" onClick={e => e.stopPropagation()}>
                            <div className="px-6 py-4 bg-gradient-to-r from-teal-600 to-emerald-600 text-white flex justify-between items-center shrink-0">
                                <div className="flex items-center gap-2.5">
                                    <BookIcon size={20} />
                                    <h2 className="text-base font-extrabold tracking-wide">控制理论全局数学符号与物理量词典 (Control Theory Glossary)</h2>
                                </div>
                                <button onClick={() => setShowGlossary(false)} className="p-1 rounded-lg bg-white/20 hover:bg-white/30 text-white transition-colors">
                                    <CloseIcon size={18} />
                                </button>
                            </div>
                            <div className="p-6 overflow-y-auto tech-scroll space-y-6">
                                {DICTIONARY_DATA.map((sec, idx) => (
                                    <div key={idx} className="space-y-3">
                                        <h3 className={`text-xs font-extrabold uppercase tracking-wider px-3 py-1.5 rounded-lg inline-block ${sec.bg} ${sec.color}`}>
                                            {sec.category}
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {sec.items.map((item, i) => (
                                                <div key={i} className="p-3 rounded-xl bg-slate-50 border border-slate-200/80 flex gap-3 items-start">
                                                    <span className="font-mono font-bold text-xs px-2 py-1 rounded bg-white border border-slate-200 text-teal-800 math-font shrink-0 shadow-sm">
                                                        {item.sym}
                                                    </span>
                                                    <div>
                                                        <div className="text-xs font-extrabold text-slate-800 mb-0.5">{item.name}</div>
                                                        <div className="text-[11px] text-slate-600 leading-relaxed">{item.desc}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ControlSimulator />);
    </script>
</body>
</html>
