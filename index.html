            'SmithPredict': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'Smith 预估器纯滞后补偿 (Smith Predictor)', desc: '在控制器内部并联运行无时延模型与含时延模型，将纯时间滞后剥离出闭环特征方程。', eq: 'u = C(s) [ r - y - (ŷ_{nodelay}(t) - ŷ_{delay}(t - τ)) ]', tuning: '拉大右侧“系统纯时间滞后 Delay”测试！普通PID遇大滞后会剧烈发散，而史密斯预估器能通过内部模型预判稳定运行。', params: { kp: [32, 1, 80, 1], kd: [16, 0.5, 40, 0.5], delay_t: [0.4, 0.05, 1.5, 0.05] },
                detail: '【参数意义】\nŷ_{nodelay} - ŷ_{delay}: 内部名义模型预测出的“无延迟输出与延迟输出之差”\n\n【底层机理】\n化工与远程控制领域的救星。纯滞后环节 e^{-τs} 会在频域引入随频率线性增长的相位滞后，极易把闭环拖入失稳。Smith 预估器用内部无延迟模型信号提前顶替真实反馈，从闭环分母中消去 e^{-τs}。' },
            'Artstein-Reduction': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'Artstein 分布卷积积分时滞降阶控制', desc: '通过有限分布卷积积分预测未来 τ 秒后的状态 z(t)，将输入时滞系统精确还原为无时滞系统！', eq: 'z(t) = x(t) + ∫_{t-τ}^t e^{A(t-s)} B u(s) ds , u = -K z(t)', tuning: 'Delay_a 设为与右侧硬件纯时间滞后拍数一致。它把还在通信管道里飞行的历史控制脉冲全部积分折现！', params: { kp: [35, 1, 80, 1], kd: [16, 0.5, 40, 0.5], delay_a: [10, 1, 50, 1] },
                detail: '【参数意义】\n∫ e^{A(t-s)}B u(s) ds: 对尚在延迟管道内未到达执行器的历史控制输入的卷积积分预判\n\n【底层机理】\nArtstein (1982) 模型降阶变换。既然从 t-τ 到 t 这段时间内发出的控制指令 u(s) 控制器自己全都记录在案，直接用状态转移矩阵积分算出系统在 t+τ 时刻的未来状态并对此做反馈，即可完美抵消任意长输入时延。' },
            'TDC': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'TDC 时间延迟估计控制 (Time-Delay Control)', desc: 'Youcef-Toumi方法：直接用上一采样拍的输入与加速度差额抵消全部未知非线性与扰动。', eq: 'u(t) = u(t-dt) + m_{nom}(K_p e - K_d v + ẍ_d - a(t-dt))', tuning: 'M_nom 为标称惯量增益。结构极度精简，无需任何弹簧或阻尼参数即可达到媲美反馈线性化的跟踪性能。', params: { m_nom: [1.8, 0.3, 8, 0.1], kp: [30, 1, 100, 1], kd: [14, 0.5, 50, 0.5] },
                detail: '【参数意义】\nu(t-dt) - m_{nom} a(t-dt): 利用一拍延迟直接估计出的集总非线性与外扰力\n\n【底层机理】\nMIT 学者 Youcef-Toumi 提出。直接利用上一毫秒的真实控制输入与实测加速度之差代替复杂的动力学计算，在机械臂与气动伺服中应用极广。' },
            'IMC': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'IMC 内模控制架构 (Internal Model Control)', desc: 'Morari经典内模结构：仅当实际对象输出与内部并行模型输出不一致时才触发反馈校正。', eq: 'd_{imc} = x - x_{model}(u) , r\' = r - d_{imc} , u = C_{imc}(r\' - x)', tuning: '若内部模型与真实物理对象完全一致且无外扰，反馈回路误差为0，系统等同于绝对稳定的开环逆控制！', params: { kp: [40, 1, 100, 1], ki: [10, 0.1, 50, 0.1], kd: [20, 0.1, 50, 0.1] },
                detail: '【参数意义】\nx - x_{model}: 仅包含外部扰动与模型失配信息的纯净内模残差信号\n\n【底层机理】\nMorari 提出的过程控制核心范式。控制器内部并联一个真实对象的数学模型，用实际测量减去模型输出即可精确分离出外部未知扰动，从而用单一滤波参数 λ 直接权衡闭环带宽与模型鲁棒性。' },
            'ILC': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'ILC 迭代学习控制 (Iterative Learning)', desc: 'Arimoto迭代学习律：记忆上一周期同一时刻的轨迹误差，逐轮修正前馈记忆表实现零误差！', eq: 'u_{k+1}(t) = u_k(t) + Γ_{ilc} e_k(t) + K_p e_{k+1}(t)', tuning: '切换右侧指令波形为“方波跳变”或多次修改目标点！每一轮跳变都是一次新的Trial，记忆库越学越准！', params: { gamma_ilc: [0.8, 0.05, 2, 0.05], kp_base: [25, 2, 60, 1] },
                detail: '【参数意义】\nu_k(t): 第 k 轮迭代存储在内存数组中的全时域前馈力矩表\nΓ_{ilc}: 跨周期迭代学习增益\n\n【底层机理】\n有本卓(Suguru Arimoto)于1984年提出。就像光刻机晶圆扫描或机械臂重复焊接：虽然单次运行中有滞后误差，但只要把第 k 次运行在每个时间点的误差记录下来并提前补偿到第 k+1 次运行中，经过数次迭代即可逼近全轨迹零误差。' },
            'Repetitive': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'RC 重复控制 (Repetitive Control)', desc: '基于周期延迟正反馈环 Q(s)e^{-Ls} 的内模实现，专门清剿周期性重复脉动与谐波误差。', eq: 'u(t) = Q_{filt} · u(t - L) + K_{rc} · e(t - L) + u_{pd}', tuning: 'Q_filter 略小于1(如0.95)以保证高频鲁棒稳定。对周期性指令与周期性扰动具有极强的记忆消除能力。', params: { k_rc: [5, 0.1, 20, 0.1], q_filter: [0.95, 0.5, 1, 0.01] },
                detail: '【参数意义】\nL: 周期环形缓存队列长度\nQ_{filt}: 略小于 1 的零相位低通稳定因子\n\n【底层机理】\n根据内模原理，周期为 L 的信号包含无穷多个谐波极点 ±j·2πk/L。重复控制器通过一个带延迟线的正反馈环 1/(1 - e^{-Ls}) 一次性在虚轴上生成无穷多个谐振峰，将所有倍频谐波误差一网打尽。' },
            'GainSched': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'Gain-Scheduling 非线性增益调度控制', desc: '根据当前工况距离调度变量 α(|e|)，在远端激进增益与近端平稳增益间平滑插值。', eq: 'K_p(e) = α(|e|) K_{p,far} + (1 - α(|e|)) K_{p,near} , α = sat(|e|/Bnd)', tuning: '航空飞控(按马赫数/动压调度)最经典的工程方法。Bnd 定义了远近两套增益平滑过渡的包络区。', params: { kp_far: [65, 10, 150, 1], kp_near: [25, 1, 60, 1], bnd: [2.0, 0.2, 10, 0.2] },
                detail: '【参数意义】\nα(|e|) ∈ [0, 1]: 依赖于工作点状态的连续增益调度插值权重\n\n【底层机理】\n采用“分而治之(Divide and Conquer)”策略：在不同的操作点线性化设计多组局部最优控制器，再根据实时测量的调度变量平滑插值过渡。' },
            'Switched': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'Switched 驻留时间多李雅普诺夫切换控制', desc: '在快速轻阻尼子控制器与慢速重阻尼子控制器之间按最小驻留时间(Dwell-Time)调度。', eq: 'u = u_{fast} (V > 1)  |  u_{slow} (V ≤ 1) , Δt_{switch} ≥ τ_{dwell}', tuning: 'Dwell(最小驻留时间)防止子系统在边界高频来回切换诱发芝诺(Zeno)失稳现象。', params: { p_fast: [3.5, 1, 10, 0.1], p_slow: [2.0, 0.2, 5, 0.1], dwell: [0.4, 0.05, 2, 0.05] },
                detail: '【参数意义】\nτ_{dwell}: 两次控制器模式切换之间强制锁定的最小驻留时间\n\n【底层机理】\n混杂系统(Hybrid/Switched Systems)理论揭示：即便两个子系统各自都是渐近稳定的，毫无限制的高频切换也可能导致总能量发散！Morse 驻留时间定理证明只要每次切换后驻留超过 τ_d，即可确保多李雅普诺夫指数衰减。' },
            'DynPole': { category: '12. 时滞补偿、网络化与高阶前沿', name: '动态复平面极点游走配置 (Dynamic Pole)', desc: '闭环极点随误差减小自动向复平面左半深处游走，兼顾启动防饱和与到位高刚度。', eq: 'p(e) = p_{min} + (p_{max} - p_{min}) e^{-α_p |e|} ⇒ u = -K(p(e)) x', tuning: '大偏差时极点退回 p_min 防止推力饱和，贴近目标后极点深入 p_max 提供超高抗扰刚度。', params: { p_max: [5.5, 1, 15, 0.5], p_min: [2.0, 0.2, 5, 0.1], alpha_p: [1.0, 0.1, 10, 0.1] },
                detail: '【参数意义】\np(e): 随实时误差幅值连续移动的时变闭环特征根位置\n\n【底层机理】\n突破定常极点配置中“快速性与抗饱和不可兼得”的矛盾，让闭环极点在左半复平面实轴上随误差收缩而动态左移。' },
            'ETC': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'ETC 事件触发网络化控制 (Tabuada)', desc: '仅当测量误差漂移超过相对阈值 σ|e|+ε₀ 时才通过网络更新控制量，其余时刻零阶保持！', eq: 'u(t) = u(t_k) , 触发时刻 t_{k+1} = inf{t > t_k : |e(t)-e(t_k)| > σ|e(t)| + ε₀}', tuning: '观察右侧红色控制力曲线！它呈现出鲜明的阶梯状零阶保持(ZOH)特征，节省了80%以上的无线通信发包率！', params: { sigma: [0.18, 0.01, 0.5, 0.01], kp: [40, 1, 100, 1], kd: [20, 0.1, 50, 0.1], eps0: [0.05, 0.01, 0.5, 0.01] },
                detail: '【参数意义】\nσ (Sigma): 相对事件触发阈值系数\nε_0: 防止芝诺(Zeno)无限高频触发的稳态绝对死区下界\n\n【底层机理】\nÅström 与 Tabuada 奠基的事件触发控制(Event-Triggered Control)。彻底打破“按固定时钟周期采样发包”的传统，按需通信(Send-on-Delta)，在严格保证李雅普诺夫衰减的前提下大幅降低无线传感器网络功耗。' },
            'Event-Triggered-MPC': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'ET-MPC 事件触发滚动预测控制', desc: '仅当实际轨迹偏离预测轨迹超过门槛 et_limit 时才唤醒CPU重算MPC优化问题。', eq: 'Re-solve MPC only if |x(t) - x_{pred}(t)| > δ_{ET}', tuning: 'ET_Limit 是触发重算的容差。在红色控制输入图上可以看到间歇性的平直保持段，显著降低机载芯片算力负荷。', params: { t_pred: [0.5, 0.05, 2.0, 0.05], lambda: [0.01, 0.001, 1, 0.001], et_limit: [0.2, 0.01, 1.0, 0.01] },
                detail: '【参数意义】\nδ_{ET} (et_limit): 预测偏差触发重规划阈值\n\n【底层机理】\n结合事件触发机制与模型预测控制：只要外部扰动不大、真实状态仍沿着上一轮预测的轨迹演进，就无需每毫秒重复求解昂贵的优化问题。' },
            'Quantized-Ctrl': { category: '12. 时滞补偿、网络化与高阶前沿', name: '量化截断有限比特网络控制 (Quantized)', desc: '模拟低比特率数字通信信道，控制指令被量化器强制截断为离散阶梯电平时仍保持稳定。', eq: 'u = Q_{step} · round( u_{raw} / Q_{step} )', tuning: '调大 Q_step (量化阶梯步长)，观察控制力变成粗糙的阶梯波，直观理解有限字长数字控制中的量化效应！', params: { kp: [48, 1, 150, 1], kd: [20, 0.1, 50, 0.1], q_step: [5.0, 0.5, 25.0, 0.5] },
                detail: '【参数意义】\nQ_{step}: 均匀量化器的最小分辨步长 (Quantization Resolution)\n\n【底层机理】\nBrockett & Liberzon 量化控制理论研究的核心对象：当执行器或无线信道只能传输有限个离散档位数值时，量化误差等效于有界加性扰动，系统最终收敛至与量化步长成正比的吸引域内。' },
            'Extended-Luenberger': { category: '12. 时滞补偿、网络化与高阶前沿', name: '扩展龙伯格观测器状态反馈 (E-Luenberger)', desc: '通过一阶雅可比线性化构建确定性全维状态观测器，重构无噪速度与位移状态。', eq: 'x̂̇ = f(x̂, u) + L_{obs} (y - C x̂) , u = -K x̂ + k·r', tuning: 'L_gain 配置龙伯格观测器极点带宽。计算开销极低，适合嵌入式微控制器状态重构。', params: { l_gain: [22, 1, 100, 1], kp: [40, 1, 100, 1], kd: [20, 0.1, 50, 0.1] },
                detail: '【参数意义】\nL_{obs}: 龙伯格观测器输出注入校正增益矩阵\n\n【底层机理】\nDavid Luenberger 提出的状态观测器理论向非线性系统的自然延伸。在控制器内部运行一个被控对象的镜像仿真器，并利用实际测量输出与镜像输出之差实时修正内部状态。' },
            'EKF-Ctrl': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'EKF 扩展卡尔曼滤波状态反馈', desc: '非线性随机状态估计标杆，利用过程噪声与测量噪声协方差比值动态调整滤波增益。', eq: 'x̂̇ = f(x̂, u) + P C^T R^{-1} (y_{noisy} - x̂) , u = -K x̂ + k·r', tuning: 'Q_cov(模型过程噪声方差)与 R_cov(传感器测量噪声方差)的博弈。调大 R_cov 可强力滤除传感器毛刺。', params: { q_cov: [12, 0.5, 50, 0.5], r_cov: [1.5, 0.1, 10, 0.1], kp: [40, 1, 100, 1], kd: [20, 0.1, 50, 0.1] },
                detail: '【参数意义】\nQ_{cov} / R_{cov}: 过程不确定性与测量噪声的信噪比权重\n\n【底层机理】\n阿波罗登月计划催生的工程传奇算法。通过一阶泰勒展开传播状态协方差矩阵，在模型先验预测与含噪传感器后验测量之间实时计算贝叶斯最优加权。' },
            'Particle-Filter': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'PF 蒙特卡洛粒子滤波反馈控制', desc: '在状态空间散布随机粒子群并通过似然权重重采样估计真实状态，专克非高斯强噪声。', eq: 'x̂_{PF} = ∑ w_i x_{particle}^{(i)} , u = K_p(r - x̂_{PF}) - K_d v + k·r', tuning: 'P_num 为蒙特卡洛粒子数量。通过粒子群群体统计均值平滑抵御极端脉冲与非高斯测量噪声。', params: { p_num: [20, 5, 50, 1], kp: [36, 1, 100, 1], kd: [18, 0.1, 50, 0.1] },
                detail: '【参数意义】\np_{num}: 序贯蒙特卡洛(SMC)采样粒子总数\n\n【底层机理】\n摆脱了卡尔曼滤波对“噪声必须服从高斯正态分布”的假设限制，用一组带权重的随机样本粒子直接近似任意形状的后验概率密度分布。' },
            'FO-PD': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'FO-PD 分数阶微积分控制 (Fractional-Order)', desc: '基于 Grünwald-Letnikov 分数阶微积分定义，实现非整数阶 D^μ (0<μ<1.5) 连续相位整形。', eq: 'u = K_p e + K_d D_t^μ e(t) , D^μ e ≈ dt^{-μ} ∑ w_j^{(μ)} e(t - j·dt)', tuning: 'Mu 是微分算子的分数阶次(如 0.85 阶微分)！突破整数阶微积分每次只能提供 90° 倍数相位的物理束缚。', params: { kp: [40, 1, 100, 1], kd: [16, 0.1, 50, 0.1], mu: [0.85, 0.1, 1.4, 0.05] },
                detail: '【参数意义】\nμ (Mu): 实数分数微分阶次 (Fractional Derivative Order)\nw_j^{(μ)}: Grünwald-Letnikov 二项式展开历史记忆权重序列\n\n【底层机理】\nPodlubny 创立的分数阶控制(FOPID)理论。整数阶一阶导数的频域响应是 (jω)^1 = ω·e^{j90°}，而 μ 阶分数导数的频域响应是 (jω)^μ = ω^μ·e^{j·90°·μ}，具有跨历史窗口的幂律长程记忆特性与任意可调的恒定相位角。' },
            'Nonlinear-Power-ADRC': { category: '12. 时滞补偿、网络化与高阶前沿', name: '分数次幂扩张观测自抗扰 (Power-ESO ADRC)', desc: '在扩张状态观测器中使用齐次分数次幂项 |e_o|^α sgn(e_o)，实现有限时间扰动收敛。', eq: 'ż₁ = z₂ - ω_o |e_o|^α sgn(e_o) , ż₂ = u - ω_o² |e_o|^{2α-1} sgn(e_o)', tuning: 'Alpha ∈ (0.5, 1.0)。相比线性ESO的渐近收敛，分数次幂ESO能在有限时间内锁定未知扰动！', params: { wo: [30, 5, 100, 1], wc: [10, 1, 50, 1], b0: [0.5, 0.05, 5, 0.05], alpha: [0.75, 0.55, 0.99, 0.01] },
                detail: '【参数意义】\nα: 齐次扩张状态观测器分数幂指数\n\n【底层机理】\n结合齐次性有限时间理论与自抗扰控制：通过引入小于 1 的分数次幂观测器校正项，大幅提升小误差区的观测刚度与收敛速度。' },
            'Implicit-Euler-Ctrl': { category: '12. 时滞补偿、网络化与高阶前沿', name: '隐式欧拉无条件稳定离散滑模 (Implicit Euler)', desc: '采用后向隐式欧拉离散化格式求解控制律，彻底消除显式数字滑模因采样步长导致的数值抖振！', eq: 'u_k = u_{eq} + K_{imp} · s_k / (1 + λ_{imp} · dt)', tuning: 'Acary & Brogliato 隐式离散滑模理论：即便将 Lambda 拉到极大，分母 (1+λ·dt) 也会自动缩放步长，绝不发生数值发散！', params: { c_surf: [5, 0.1, 20, 0.1], lambda: [60, 1, 200, 1] },
                detail: '【参数意义】\n1 / (1 + λ·dt): 隐式后向欧拉格式导出的数值阻尼缩放算子\n\n【底层机理】\n数字计算机在以固定采样周期 dt 实现连续高增益或滑模控制时，传统前向显式欧拉格式会因步长过冲产生数字极限环抖振。隐式欧拉法通过向后一步预解包含项，实现了对任意大增益的 A-稳定性(无条件数值稳定)。' },
            'Lorenz-Coupled': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'Lorenz 混沌吸引子流形耦合控制', desc: '内置三维洛伦兹(Lorenz)混沌微分方程，演示非线性混沌流形注入与混沌抑制镇定。', eq: 'ẋ_L = σ(y_L - x_L), ẏ_L = x_L(ρ - z_L) - y_L, ż_L = x_L y_L - β z_L', tuning: 'Rho 为瑞利数(大于24.74产生蝴蝶混沌吸引子)。观察相平面与紫色参考线上的混沌轨道演化与反馈抑制！', params: { kp: [55, 5, 150, 1], kd: [22, 1, 50, 0.5], rho: [28.0, 10.0, 50.0, 1.0] },
                detail: '【参数意义】\nρ (Rho): 洛伦兹混沌系统的瑞利数(Rayleigh Number)\n\n【底层机理】\nOtt-Grebogi-Yorke (OGY) 与 Pyragas 混沌控制研究经典场景：在控制器中耦合三维 Lorenz 蝴蝶吸引子动态，直观展示确定性混沌轨道的非周期有界遍历特征及线性状态反馈对混沌振荡的驯服能力。' },
            'Speed-Gradient': { category: '12. 时滞补偿、网络化与高阶前沿', name: 'Fradkov 速度梯度法控制 (Speed-Gradient)', desc: '俄罗斯控制学派经典：令控制量沿目标能量泛函时间导数(速度)的负梯度方向演化。', eq: 'Q(x) = ½ e² + ½ γ_v v² , u̇ = -γ_{sg} ∇_u (Q̇(x, u)) - K_d v', tuning: 'Gamma_sg 控制速度梯度下降速率。兼具李雅普诺夫能量下降保证与积分器平滑输出特征。', params: { gamma_sg: [25, 1, 100, 1], q_weight: [1.5, 0.1, 10, 0.1] },
                detail: '【参数意义】\n∇_u(Q̇): 目标李雅普诺夫函数时间导数 Q̇ 对控制输入 u 的偏导梯度\n\n【底层机理】\n俄罗斯科学院 Fradkov 教授于1979年提出的速度梯度法(Speed-Gradient Method)。当无法直接求取使 Q(x) 最小的 u 时，转而求取使 Q(x) 的变化速度 Q̇ 下降最快的控制梯度方向。' },

            // =========================================================================
            // === 【补充经典与前沿细分方法，确保 128 种方法各具特色且完整覆盖】 ===
            // =========================================================================
            'P-PI-Cascade': { category: '01. 各类PID与工业变体', name: 'P-PI 工业伺服标准串级控制', desc: '工业伺服驱动器最标准的三环简化架构：位置环纯P比例 + 速度环PI积分抗扰。', eq: 'v_{ref} = K_{pp} e , u = K_{vp}(v_{ref} - v) + K_{vi} ∫(v_{ref} - v)dt', tuning: '现代交流伺服电机(如松下/安川/汇川)出厂默认架构：位置环纯P保证绝对不因位置积分超调，速度环PI消除一切外力静差！', params: { k_pp: [4.2, 0.5, 15, 0.1], k_vp: [35, 5, 100, 1], k_vi: [25, 0, 100, 1] },
                detail: '【参数意义】\nK_{pp}: 位置环比例增益(决定位置环带宽)\nK_{vp}, K_{vi}: 速度环比例与积分增益\n\n【底层机理】\n为什么工业伺服位置环几乎不用I和D，只用纯P？因为一旦速度内环包含积分器 K_{vi}，它就能100%抵消恒定外力与摩擦力，从而使外环只需一个简单的比例增益 K_{pp} 即可实现零静差、零超调定位！' },
            'Bilinear-Tustin-PID': { category: '01. 各类PID与工业变体', name: '双线性 Tustin 离散变换 PID', desc: '采用梯形积分(Tustin双线性变换 s = 2/T·(z-1)/(z+1))离散化，频域保真度最高。', eq: 'I_k = I_{k-1} + (K_i dt / 2)(e_k + e_{k-1}) , D_k = α_d D_{k-1} - β_d(x_k - x_{k-1})', tuning: '相比前向欧拉积分，Tustin梯形积分将左半S平面无畸变地一一映射至Z平面单位圆内，避免离散化相位失真。', params: { kp: [42, 1, 100, 1], ki: [12, 0, 50, 0.5], kd: [20, 0, 50, 0.5], tf_d: [0.03, 0.01, 0.2, 0.01] },
                detail: '【参数意义】\n(e_k + e_{k-1})·dt/2: 梯形数值积分法则\ntf_d: 双线性微分滤波时间常数\n\n【底层机理】\n数字信号处理与飞控计算机的标准离散化规范。通过双线性变换 s ≈ (2/T)(z-1)/(z+1)，严格保持连续域控制器的奈奎斯特稳定属性。' },
            'Gain-Margin-PID': { category: '01. 各类PID与工业变体', name: 'Åström-Hägglund 继电整定 PID', desc: '基于临界振荡周期 T_u 与临界增益 K_u 的改进型 Ziegler-Nichols 无超调配比律。', eq: 'K_p = 0.33 K_u , T_i = 0.5 T_u , T_d = 0.33 T_u (No-Overshoot Rule)', tuning: '只需调节单一旋钮 Ku (临界增益估计) 与 Tu (临界周期)，自动按 Åström 无超调比例同步联动 P/I/D 三项参数！', params: { ku_est: [110, 20, 300, 5], tu_est: [1.2, 0.3, 4.0, 0.1] },
                detail: '【参数意义】\nK_u: 极限环临界增益\nT_u: 极限环临界振荡周期\n\n【底层机理】\nÅström 与 Hägglund 在经典 Ziegler-Nichols 整定法基础上改进的工业自整定准则：将比例系数降为 0.33K_u 并强化微分作用至 T_d = 0.33T_u，消除了原版 Z-N 法高达 25%~40% 的剧烈超调。' },
            'IMC-PID': { category: '01. 各类PID与工业变体', name: '内模整定单参数 PID (λ-Tuning PID)', desc: 'Rivera-Morari 内模整定法：将二阶对象逆模型直接解析折算为单一闭环时间常数 λ_c 控制的 PID。', eq: 'K_p = 2ζω_n/(b₀λ_c), K_i = ω_n²/(b₀λ_c), K_d = 1/(b₀λ_c)', tuning: '极简调参典范！全系统只有 Lambda_c (期望闭环响应时间常数)一个主旋钮：调小即快，调大即稳！', params: { lambda_c: [0.25, 0.05, 1.5, 0.02], ki_trim: [1.0, 0.0, 3.0, 0.1] },
                detail: '【参数意义】\nλ_c (lambda_c): 期望的一阶闭环响应时间常数\n\n【底层机理】\nRivera, Morari & Skogestad 提出的 IMC-PID (又称 Lambda 整定法)。利用被控对象的已知物理参数 (m, c, k)，解析反推出使闭环传递函数逼近 1/(λ_c s + 1) 的 P、I、D 参数解析式，把三维盲调简化为一维带宽选择。' },

            // === 补充 03/04/05/06/07/08/09/10/11/12 分支方法 ===
            'LQR-Servo-FF': { category: '03. 现代状态空间与最优控制', name: 'LQR 前馈零极点对消伺服 (LQR + Feedforward)', desc: '在标准LQR状态反馈基础上，引入精确直流增益逆矩阵 N_bar 前馈，消除名义静差且无积分超调。', eq: 'u = -K_{lqr} x + N̄ · r , N̄ = -(C(A - B K_{lqr})^{-1}B)^{-1}', tuning: '对比标准 LQR 与 LQI：它不引入积分器（因此完全没有积分滞后超调），而是靠解析前馈增益 N_bar 实现名义零静差！', params: { q_x: [120, 5, 500, 5], q_v: [15, 1, 50, 1], r_w: [0.5, 0.05, 10, 0.05] },
                detail: '【参数意义】\nN̄ = K_1 + k: 保证闭环直流增益 T(0) = 1 的前馈缩放标量\n\n【底层机理】\n标准状态反馈 u = -Kx + r 的闭环稳态值为 x_ss = r / (1 + k/K_1) ≠ r。通过乘以前馈补偿因子 N̄ = -(C(A-BK)^{-1}B)^{-1}，在不增加系统阶数、不牺牲相位裕度的前提下直接令名义稳态误差归零。' },
            'Linear-Time-Optimal-Switch': { category: '03. 现代状态空间与最优控制', name: '近时间最优饱和线性反馈 (PTOS)', desc: 'Workman近似时间最优伺服(Proximate Time-Optimal Servomechanism)，硬盘磁头寻道核心算法。', eq: 'u = sat_{u_{max}}[ k_2 ( f_{ptos}(e) - v ) ] + k·r', tuning: '机械硬盘(HDD)磁头毫秒级跨磁道寻道的核心专利算法！连续平滑逼近时间最优抛物线，到位瞬间无缝退化为线性PD。', params: { u_max_p: [60, 10, 180, 5], alpha_ptos: [0.85, 0.3, 0.99, 0.02], k2_ptos: [22, 5, 60, 1] },
                detail: '【参数意义】\nf_{ptos}(e): 在线性区为 (k_1/k_2)e、在大误差区为 √(2α·a_{max}|e|)sgn(e) 的平滑拼接速度规划曲线\n\n【底层机理】\nWorkman, Kosut & Franklin 提出。纯时间最优 Bang-Bang 控制在实际采样与模型误差下必然产生极限环抖振。PTOS 通过引入折扣加速度因子 α < 1 构造连续饱和根号速度曲线，完美实现了从满功率制动到线性微定位的 C¹ 光滑衔接。' },
            'Petersen-GuaranteedCost': { category: '04. 鲁棒控制与H∞体系', name: '保性能鲁棒控制 (Guaranteed Cost Control)', desc: '针对范数有界参数不确定性 ΔA，通过修正黎卡提方程保证二次型性能指标绝不劣于上界 J*。', eq: '(A+B K)^T P + P(A+B K) + ε P D D^T P + ε^{-1} E^T E + Q + K^T R K < 0', tuning: 'Eps_gc 为 Petersen 引理尺度参数，Delta_b 为预设的参数不确定性强度。', params: { q_gc: [130, 10, 500, 10], eps_gc: [0.8, 0.1, 5.0, 0.1], delta_b: [2.0, 0.2, 8.0, 0.2] },
                detail: '【参数意义】\nε_{gc}: Petersen 不等式消去不确定矩阵 ΔF(t) 的自由度尺度因子\n\n【底层机理】\nChang & Peng 以及 Petersen 提出的保性能控制理论：利用矩阵不等式 2X^T Δ Y ≤ ε X^T X + ε^{-1} Y^T Y 将所有可能的参数摄动包裹进一个确定性黎卡提方程中，给出性能泛函的严格上界保障。' },
            'Passivity-Shortage-Comp': { category: '04. 鲁棒控制与H∞体系', name: '无源性不足度鲁棒补偿 (Passivity-Index)', desc: '量化系统的输入无源度 ν 与输出无源度 ρ，通过前馈并联与负反馈注入填补无源赤字。', eq: 'u = -K_{rho} y + v_{ext} , 确保闭环满足无源指数 (ν + ρ_{ctrl} > 0)', tuning: 'Rho_pass 注入输出严格无源裕度，Nu_ff 调节前馈通道，对任意无源负载变化保持绝对鲁棒。', params: { rho_pass: [22, 2, 60, 1], kp_pass: [42, 5, 100, 1], ki_pass: [8, 0, 40, 0.5] },
                detail: '【参数意义】\nρ_{pass}: 输出严格无源性指数 (Output Strict Passivity Index)\n\n【底层机理】\nBao & Lee 等发展的无源性指数(Passivity Indices)理论：即使被控对象本身因不稳定重力和时延存在“无源性赤字(Passivity Shortage)”，只要控制器的无源盈余大于对象的赤字，闭环系统就依然保持 L2 有限增益稳定。' },
            'MinMax-MPC': { category: '05. 模型预测与滚动优化', name: 'Min-Max 最坏情况鲁棒预测控制', desc: '在预测时域内显式考虑最大可能扰动 w_max 的对抗效应，求解极小化极大代价的控制律。', eq: 'u = argmin_u max_{w ∈ W} J(x_{pred}(u, w), u)', tuning: 'W_bound 为假想敌最大扰动边界。比标准MPC具备更强的抗逆风裕度与状态纠偏力度。', params: { t_pred: [0.5, 0.1, 2.0, 0.05], w_bound: [15, 0, 60, 1], lambda: [0.02, 0.001, 0.5, 0.005] },
                detail: '【参数意义】\nw_{bound}: 预测视野内考虑的最恶劣对抗性外力上界\n\n【底层机理】\nScokaert & Mayne 提出的 Min-Max MPC。在滚动优化时不再假设未来风平浪静，而是假设未来每一步都会遭到有界集 W 内最不利扰动的阻挠，在此前提下规划出最稳妥的控制动作。' },
            'Boundary-Layer-Varying-SMC': { category: '06. 滑模变结构控制家族', name: '时变边界层滑模控制 (Slotine Varying-Φ)', desc: 'Slotine经典改进：边界层厚度 Φ(t) 随状态动态变化，平衡时变带宽与跟踪精度。', eq: 'u = u_{eq} + (K(x) - Φ̇) sat(s / Φ(t)) , Φ̇ + λ Φ = K(target)', tuning: 'MIT 学者 Slotine 专著《Applied Nonlinear Control》核心改进：动态调整边界层厚度 Φ(t)，削弱初始抖振并锁紧稳态精度。', params: { lam_sl: [6.0, 1.0, 20.0, 0.5], k_max_sl: [25, 5, 80, 1], phi_min: [0.05, 0.01, 0.5, 0.01] },
                detail: '【参数意义】\nΦ(t): 满足一阶微分方程 Φ̇ + λΦ = K 的动态边界层厚度\n\n【底层机理】\n固定边界层 sat(s/ε) 只能按最坏情况选取较厚的 ε，牺牲了稳态精度。Slotine 提出令边界层厚度 Φ(t) 随运动剧烈程度动态呼吸伸缩，并把 -Φ̇ 修正项并入切换增益以严格维持滑模吸引条件 s·ṡ ≤ (Φ̇ - η)|s|。' },
            'Global-SMC': { category: '06. 滑模变结构控制家族', name: '全局滑模控制 (Global Sliding Mode)', desc: '在滑模面中减去初始状态指数衰减项 s(0)e^{-λt}，使轨迹从 t=0 时刻起100%位于滑模面上！', eq: 's(t) = (c·e - v) - (c·e(0) - v(0)) e^{-λ_{gsmc} t}', tuning: 'Lam_gsmc 控制初始滑模偏置的指数归零速率。彻底消除了传统滑模的到达段(Reaching Phase)，全程鲁棒无超调！', params: { c_surf: [5.0, 0.5, 15.0, 0.5], lam_gsmc: [4.0, 0.5, 15.0, 0.5], k_gain: [20, 2, 80, 1] },
                detail: '【参数意义】\n(c·e(0) - v(0)) e^{-λt}: 强制令初始时刻 s(0) ≡ 0 的指数衰减弯曲偏置项\n\n【底层机理】\nLu & Spurgeon 等发展的全局滑模控制(GSMC)。通过构造一条从初始状态点 (e(0), v(0)) 出发并按指数规律平滑汇入标准线性滑模面的时变流形，使系统从启动第 0 秒起就处于滑模运动状态。' },
            'HOSM-Quasi-Continuous': { category: '06. 滑模变结构控制家族', name: '准连续高阶滑模控制 (Quasi-Continuous HOSM)', desc: 'Levant准连续滑模：控制律除二阶滑模原点 s=ṡ=0 外处处连续，抖振远低于传统滑模。', eq: 'u = u_{eq} + α_{qc} (ṡ + β |s|^{1/2} sgn(s)) / (|ṡ| + β |s|^{1/2})', tuning: '观察公式中的有理分式结构：分子与分母具有相同的齐次度，使控制量在穿越 s=0 或 ṡ=0 时保持连续过渡！', params: { c_surf: [5.0, 0.5, 15, 0.5], alpha_qc: [22, 2, 80, 1], beta_qc: [4.0, 0.5, 15, 0.5] },
                detail: '【参数意义】\n(ṡ + β|s|^{1/2}sgn(s)) / (|ṡ| + β|s|^{1/2}): 取值严格在 [-1, +1] 之间且除原点外处处连续的齐次有理切换函数\n\n【底层机理】\nLevant (2005) 提出的准连续高阶滑模(Quasi-Continuous HOSM)。传统高阶滑模在一维流形 s=0 上处处不连续，而准连续滑模仅在零测度的二维交点 (s=0, ṡ=0) 处不连续，因此在实际运动过程中控制信号极为柔顺。' },
            'Active-Force-Control': { category: '07. 自抗扰与扰动观测补偿', name: 'AFC 主动抗力控制 (Hewit Active Force)', desc: '利用估计质量与实测加速度直接代数闭环抵消一切惯性外力与环境阻力。', eq: 'F^* = u_{prev} - M_{est} · a_{filt} , u = M_{est}(K_p e - K_d v) + F^*', tuning: 'Hewit 提出的主动抗力控制(AFC)：只要惯量估计 M_est 接近真实质量 M，就能形成超强解耦刚度。', params: { m_est: [2.0, 0.5, 8.0, 0.1], kp: [35, 5, 100, 1], kd: [18, 2, 50, 0.5] },
                detail: '【参数意义】\nF^*: 主动抗力回路实时测算的未建模外力总和\n\n【底层机理】\n基于牛顿第二定律 ΣF = M·a 的最直接逆用：既然驱动器输出的推力是 u，而物体产生的实际惯性力是 M·a，那么两者之差 F^* = u - M·a 必定等于弹簧力、阻尼力、摩擦力与风力的总和！将其直接正反馈叠加即可抵消全部阻力。' },
            'Equivalent-Input-Disturbance': { category: '07. 自抗扰与扰动观测补偿', name: 'EID 等效输入扰动补偿控制 (She方法)', desc: '佘锦华教授EID架构：通过状态观测器残差经控制通道伪逆投影，将一切内外部干扰映射为等效输入扰动。', eq: 'd̂_{eid} = F_{lpf}(s) [ B^+ L_{obs} (y - C x̂) + u_{diff} ] , u = u_{state} - d̂_{eid}', tuning: 'W_eid 为低通滤波器截止角频率。无需对输出信号求导，直接利用龙伯格观测器修正项重构等效输入干扰！', params: { w_eid: [35, 5, 100, 1], l_eid: [25, 5, 80, 1], kp: [42, 5, 100, 1] },
                detail: '【参数意义】\nB^+ = (B^T B)^{-1} B^T: 控制输入矩阵的 Moore-Penrose 伪逆\n\n【底层机理】\n佘锦华(Jinhua She)教授提出的等效输入扰动(Equivalent Input Disturbance, EID)方法。不同于DOB需要使用易受噪声污染的对象逆模型 G_n^{-1}(s)，EID完全基于状态观测器内部信号代数投影提取扰动，对测量噪声更为稳健。' },
            'Harmonic-Oscillator-PBC': { category: '08. 非线性几何与能量控制', name: '非线性双曲余弦势能成型 (Hyperbolic-PBC)', desc: '构造 ln(cosh(e)) 双曲余弦人工势场：小误差区呈二次型柔和线性，大误差区呈饱和恒力防过载！', eq: 'V_d(e) = K_p α^{-2} ln(cosh(α e)) ⇒ u = K_p α^{-1} tanh(α e) - K_d tanh(β v) + kr', tuning: '天然防饱和的优雅几何控制律！由于 tanh(·) 有界在 [-1, 1] 内，无论初始误差多大，比例与阻尼力都绝不溢出。', params: { kp: [45, 5, 100, 1], kd: [22, 2, 50, 0.5], alpha_th: [0.6, 0.1, 2.0, 0.05] },
                detail: '【参数意义】\ntanh(α e): 双曲余弦势能函数 V(e) = ln(cosh(αe)) 的导数梯度力\n\n【底层机理】\n普通二次型势能 ½K_p e² 的恢复力随误差无限线性增长，在大跨度运动时必然导致执行器饱和。双曲余弦势场在原点附近泰勒展开等同于 ½K_p e²，而在远端渐近呈线性锥面，恢复力平滑饱和于 ±K_p/α。' },
            'Flatness-Trajectory-Track': { category: '08. 非线性几何与能量控制', name: '微分平坦五次多项式轨迹规划跟踪 (Flatness)', desc: 'Fliess微分平坦性理论：利用平坦输出生成初末速度/加速度均为零的五次多项式平滑轨迹并逆映射前馈！', eq: 'y_d(τ) = y_0 + Δy(10τ³ - 15τ⁴ + 6τ⁵) , u = m ÿ_d + c ẏ_d + k y_d + PD(e)', tuning: '观察位置图中柔美至极的 S 型紫色五次多项式轨迹(Minimum-Jerk Trajectory)！启动与停止瞬间的加加速度冲击极小。', params: { t_plan: [1.5, 0.4, 4.0, 0.1], kp: [45, 5, 100, 1], kd: [20, 2, 50, 0.5] },
                detail: '【参数意义】\n10τ³ - 15τ⁴ + 6τ⁵: 最小加加速度(Minimum-Jerk)五次多项式时间归一化曲线\nt_{plan}: 轨迹规划到达时间\n\n【底层机理】\nFliess, Lévine, Martin & Rouchon 创立的微分平坦性(Differential Flatness)理论。利用系统的平坦输出 y=x，无需积分微分方程即可直接由五次多项式的二阶导数代数写出前馈控制力 u_ff(t)，实现零超调丝滑转移。' },
            'Composite-MRAC': { category: '09. 自适应与参数辨识控制', name: 'Slotine-Li 复合自适应控制 (Composite Adaptive)', desc: '同时利用状态跟踪误差 e_m 与滤波预测建模误差 ε_pred 双重信息源驱动参数自适应更新！', eq: 'θ̂̇ = -Γ ( φ · e_{track} + γ_{pred} · W_{filt}^T · ε_{pred} )', tuning: 'MIT 学者 Slotine 与 Li 提出的复合自适应杰作：结合了跟踪误差反馈与预测误差辨识，参数收敛既快又平滑！', params: { gamma: [12, 1, 50, 1], g_pred: [8, 0.5, 30, 0.5], wn: [2.5, 0.5, 8, 0.1] },
                detail: '【参数意义】\ne_{track}: 轨迹跟踪误差\nε_{pred}: 低通滤波动力学方程的功率预测误差\n\n【底层机理】\n直接自适应(MRAC)只关注跟踪误差归零而不管参数是否真实，间接自适应(STR)只关注辨识误差而忽视瞬态跟踪。Slotine & Li (1989) 将两类误差合成在同一个李雅普诺夫函数中，实现了双重加速收敛。' }
